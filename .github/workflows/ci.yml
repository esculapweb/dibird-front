# Migrated from bitbucket-pipelines.yml. GitHub's free plan gives 2000 Linux
# minutes a month on a private repository and one run takes about five minutes,
# so pull requests are gated too — on Bitbucket (50 minutes a month) only master
# was checked, and a red master was found after the fact instead of before the
# merge.
#
# "A PR run restarts on every push to the source branch" is handled by the
# concurrency block below, not by dropping the gate.
#
# Caveat about blocking a merge: branch protection and rulesets on a private
# repository require GitHub Pro, so a red check is visible in the PR but does
# not technically prevent merging.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual run from any branch (usually a feature branch before the PR is
  # opened). Bitbucket had no equivalent — there a branch was checked only by
  # pushing it to master.
  workflow_dispatch:

# The job only reads the code: it publishes nothing, comments on nothing and
# touches no releases. Spelling that out here caps GITHUB_TOKEN regardless of
# what the repository default is set to.
permissions:
  contents: read

# A new push to an open pull request cancels the previous run: while the PR is
# open, only the result for the latest commit matters. No cancelling on master —
# that run is the record of whether master itself is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check + Test
    runs-on: ubuntu-latest
    # A normal run fits in five minutes. Twenty is the ceiling for a hung test:
    # a stuck job burns free-plan minutes just like a working one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node 20 mirrors the `node:20` image the Bitbucket pipeline ran on. The
      # repository pins no version of its own (no .nvmrc, no `engines` field),
      # so this line is the only place to bump it.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run check` is tsc + eslint; split into two steps so the run summary
      # shows which gate failed without opening the log.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # An empty value in a catalogue beats the i18next fallback and renders as
      # a blank label — nothing else in the pipeline sees that. Runs in a second,
      # before the tests. `npm run i18n:unused` is deliberately not here: it only
      # prints, and deciding a key is dead stays a human's call (see CLAUDE.md).
      - name: Locale catalogues
        run: npm run i18n:empty

      # Dependency versions against the Expo SDK, plus the app config and the
      # native project setup — 21 checks, about three seconds. Nothing else in
      # the pipeline notices a package that is a minor off what the SDK expects;
      # it surfaces at build or, worse, at runtime on a device.
      #
      # --yes because expo-doctor is not a dependency of the project: npx fetches
      # it on the fly and would otherwise stop at an install prompt on a runner
      # with no TTY. The flip side is that the version is not pinned — a new
      # release can add a check and turn CI red with nothing changed here.
      #
      # It does not need .env: the only variable app.config.js reads
      # (EXPO_PUBLIC_ENV) falls back to "production", and the run passes with the
      # env files hidden away entirely.
      - name: expo-doctor
        run: npx --yes expo-doctor

      # test:ci = jest --forceExit. Repository tests leave native
      # better-sqlite3 handles open across the whole worker process (documented
      # in hooks/repositories/testDb.ts) — locally jest force-exits on its own
      # after printing a warning, but inside a CI container this left the step
      # hanging forever (Bitbucket showed "In progress" with no further output)
      # instead of exiting.
      #
      # --coverage on top of it enforces coverageThreshold from jest.config.js:
      # the floor has to fail in a pull request, not after the merge. It is added
      # here rather than through `npm run test:coverage` because that script has
      # no --forceExit, and the step would hang.
      - name: Test + coverage
        run: npm run test:ci -- --coverage
