image: node:20

pipelines:
  branches:
    master:
      - step:
          name: Check + Test
          caches:
            - node
          script:
            - npm ci
            - npm run check
            # test:ci = jest --forceExit. Repository tests leave native
            # better-sqlite3 handles open across the whole worker process
            # (documented in hooks/repositories/testDb.ts) — locally jest
            # force-exits on its own after printing a warning, but under
            # Bitbucket's container this leaves the step hanging forever
            # ("In progress" with no further output) instead of exiting.
            - npm run test:ci
