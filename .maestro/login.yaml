# Email/password login — the gateway flow for every other authenticated
# screen. Needs a dev-client build on a running simulator (`npm run e2e`)
# and a real test account.
#
# Tests the wrong-password path first (Phase 1), then real credentials
# (Phase 2) — a bare "did Welcome disappear" check would pass either way,
# since that happens the moment "Continue with email" is tapped, before
# any credentials are submitted.
#
# appId matches the dev-client build (com.dibird.app.dev); other variants:
# com.dibird.app.preview / com.dibird.app (production).
#
# tags: ios — lets .maestro/run.sh's `--include-tags` filter flows by platform.
appId: com.dibird.app.dev
tags:
  - ios
---
# NOTE: icon+label buttons (e.g. "Continue with email") get their
# accessible text auto-joined as ", Continue with email" — text selectors
# for those need `.*...*.` regex wrap, not a literal match.
#
# clearKeychain in addition to clearState: true — the session token lives
# in iOS Keychain (expo-secure-store), which clearState does not wipe.
# Without this, a prior login skips Welcome entirely.
- clearKeychain
- launchApp:
    clearState: true

- runFlow: common/ios-bootstrap.yaml

# Phase 1: wrong password first — proves the attempt is actually
# submitted and rejected.
- assertVisible: ".*Continue with email.*"
- tapOn: ".*Continue with email.*"
- tapOn:
    id: "email-input"
# setClipboard+pasteText, not inputText: keyboard-layout independent.
- setClipboard: "${TEST_EMAIL}"
- pasteText
- tapOn:
    id: "password-input"
# iOS silently blocks paste into secureTextEntry fields — toggle
# visibility off first so pasteText actually lands.
- tapOn:
    id: "password-input-toggle-visibility"
- tapOn:
    id: "password-input"
- setClipboard: "obviously-wrong-password-123"
- pasteText
# Tap a static label rather than hideKeyboard — see
# common/ios-credential-entry.yaml for why.
- tapOn:
    text: "Welcome back"
# id selector, not text: ".*Log In.*" ambiguously matches both the header
# subtitle and the real submit button.
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*Login failed.*"

# Phase 2: navigate back to Welcome instead of erasing the wrong password
# in place — eraseText leaves stray characters behind unreliably.
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible: ".*Continue with email.*"
- runFlow: common/ios-credential-entry.yaml
# Confirms landing on the authenticated MainScreen, not just Welcome's
# absence.
- assertVisible: ".*Observations.*"
