# The chosen sort order survives a restart.
#
# useSavedSort writes the preference to AsyncStorage and every screen of a
# section shares it (hooks/useScreenSort.tsx). Unit tests cover the hook; what
# they can't cover is the round trip through real storage and a real relaunch,
# which is the half that actually breaks — a preference that silently resets
# looks like "the app forgot", not like a failing test.
#
# Asserted on the radio's own checked marker rather than on the order of the
# list: the shared test account's Observations list is routinely empty (every
# other flow cleans up after itself), so there is nothing to reorder. The
# marker comes from RadioGroup's testID, wired up in SortSheetContent for
# exactly this flow.
#
# Restores the default order at the end — the preference is shared with every
# other flow that opens this list.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp

- runFlow: common/bootstrap.yaml

# The section grid sits below the fold: the dashboard's height follows the
# account's own data, so the tile is not reliably in view (see the longer
# note in online-create-place.yaml). No-op when it already is.
- scrollUntilVisible:
    element:
      id: "section-Observations"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Observations"
- waitForAnimationToEnd

# Option 2 is "alphabetic" for this screen (util/sortOptionsList.ts) — picked
# by index, not by its translated label, so the flow doesn't break the moment
# someone rewords the option or runs after settings-language-switch.yaml.
- tapOn:
    id: "sort-button"
- extendedWaitUntil:
    visible:
      id: "sort-option-2"
    timeout: 6000
- tapOn:
    id: "sort-option-2"
# Picking an option closes the sheet (SortSheetContent's changeHandler).
- waitForAnimationToEnd

# It took effect in this session first — otherwise a persisted-but-ignored
# preference would still pass the relaunch check below.
- tapOn:
    id: "sort-button"
- extendedWaitUntil:
    visible:
      id: "sort-option-2-checked"
    timeout: 6000
- tapOn:
    id: "bottom-sheet-cancel-button"
    optional: true
- swipe:
    direction: DOWN
- waitForAnimationToEnd

# ---- and now the part that needs a real restart ----
- launchApp
- runFlow: common/bootstrap.yaml
# Below the fold, same as above.
- scrollUntilVisible:
    element:
      id: "section-Observations"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Observations"
- waitForAnimationToEnd
- tapOn:
    id: "sort-button"
- extendedWaitUntil:
    visible:
      id: "sort-option-2-checked"
    timeout: 6000

# ---- restore the default for everyone else ----
- tapOn:
    id: "sort-option-0"
- waitForAnimationToEnd
- tapOn:
    id: "sort-button"
- extendedWaitUntil:
    visible:
      id: "sort-option-0-checked"
    timeout: 6000
- swipe:
    direction: DOWN
- waitForAnimationToEnd
- runFlow: common/back.yaml
# Scroll back up first: MainScreen keeps the offset left by the scrollUntilVisible
# that reached the section grid, so on return the top of the dashboard sits under
# the header — present in the hierarchy, but not visible, which is what Maestro
# asserts on. Same reason as in offline-nested-observation-in-diary.yaml.
- scrollUntilVisible:
    element:
      id: "quick-action-observation"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 10000
