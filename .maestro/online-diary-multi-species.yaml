# Several species at once — the way a Diary is filled, online.
#
# In a diary the species list is always multi-select: rows are checked, and
# "Done" hands the set to the form, which shows it as a summary of chips
# (multi-species-summary). One press of the header save then creates one
# observation per species. Unit tests cover each half of that chain with the
# other half mocked; this flow is the only place both meet on a device —
# that the check marks, the Done button and the summary really render, and
# that a single save files every species under the diary.
#
# online-nested-observation.yaml already covers the diary-scoped editor
# itself (the observation is filed under the diary it was opened from, the
# save returns to the diary). This flow takes that as given.
#
# Create and delete net to zero: both observations and the diary holding them
# are removed at the end, and MainScreen's counters are asserted back to
# their starting values — the account is shared with every other flow.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp

- runFlow: common/bootstrap.yaml

- extendedWaitUntil:
    visible:
      id: "diaries-stat-value"
    timeout: 20000
- copyTextFrom:
    id: "diaries-stat-value"
- evalScript: ${output.diaryBaselineCount = maestro.copiedText}
- copyTextFrom:
    id: "observations-stat-value"
- evalScript: ${output.observationBaselineCount = maestro.copiedText}

# ---- CREATE the Diary that both observations go into ----
- tapOn:
    id: "quick-action-diary"
# A distinctive note so this diary can be found by text later — list rows
# carry no testID, and online there is no pending icon to grab either.
- tapOn: ".*Add a note.*"
- setClipboard: "Multi Species E2E Diary"
- pasteText
# Defocus without navigating — tapping a static label on the same form, the
# same technique common/credential-entry.yaml uses.
- tapOn: ".*Location.*"
- tapOn:
    id: "diary-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "diary-save-button"

# ---- TWO species checked in one go ----
# Creating a diary goes straight on to its first observation, with the
# species list already open (DiaryDetailScreen's addObservation param).
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 14000
# Remember which species the dropdown happened to offer (contents are
# backend/seed-data dependent): it is how each row is recognised on the diary
# screen below, and how each observation is reopened for cleanup.
# Just the common name: the dropdown row reads "Common name, Scientific name"
# (and on iOS the accessibility node keeps the trailing space), while the
# observation row on the diary shows the common name alone.
- copyTextFrom:
    id: "option-row-0"
- evalScript: ${output.firstSpecies = maestro.copiedText.split(",")[0]}
- copyTextFrom:
    id: "option-row-1"
- evalScript: ${output.secondSpecies = maestro.copiedText.split(",")[0]}
# A tap only checks a row — the list stays open until Done.
- tapOn:
    id: "option-row-0"
- assertVisible:
    id: "option-row-0"
- tapOn:
    id: "option-row-1"
- tapOn:
    id: "select-multiple-done"

# The form shows the whole set, not just the first species.
- extendedWaitUntil:
    visible:
      id: "multi-species-summary"
    timeout: 5000
- assertVisible: ".*${output.firstSpecies}.*"
- assertVisible: ".*${output.secondSpecies}.*"
- tapOn:
    id: "observation-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "observation-save-button"

# ---- both of them are in the diary ----
- extendedWaitUntil:
    visible:
      id: "diary-edit-button"
    timeout: 8000
- extendedWaitUntil:
    visible: ".*${output.firstSpecies}.*"
    timeout: 10000
- assertVisible: ".*${output.secondSpecies}.*"

# ---- Cleanup: both observations (they reference the diary), then the diary ----
- tapOn: ".*${output.firstSpecies}.*"
- extendedWaitUntil:
    visible:
      id: "observation-edit-button"
    timeout: 8000
- tapOn:
    id: "overflow-button"
- tapOn:
    id: "observation-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"

# Delete returns to the diary the observation was opened from.
- extendedWaitUntil:
    visible:
      id: "diary-edit-button"
    timeout: 8000
- tapOn: ".*${output.secondSpecies}.*"
- extendedWaitUntil:
    visible:
      id: "observation-edit-button"
    timeout: 8000
- tapOn:
    id: "overflow-button"
- tapOn:
    id: "observation-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"

- extendedWaitUntil:
    visible:
      id: "diary-edit-button"
    timeout: 8000
- tapOn:
    id: "overflow-button"
- tapOn:
    id: "diary-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"

# Both counters back where they started — nothing of this flow's own is left
# behind for the next one to trip over.
- extendedWaitUntil:
    visible:
      id: "observations-stat-value"
    timeout: 15000
- assertVisible:
    id: "observations-stat-value"
    text: ${output.observationBaselineCount}
- assertVisible:
    id: "diaries-stat-value"
    text: ${output.diaryBaselineCount}
