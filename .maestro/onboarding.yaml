# The whole new-account onboarding: "Skip" on the first step, then a full pass
# — two value pages, country, location, first observation — and a check that
# the flow does not come back afterwards.
#
# A device is not a luxury here: almost everything that can break in
# onboarding breaks at the seam between the navigator and the flow's status,
# not inside a screen. `AppStack` declares `Onboarding` first and renders
# `null` while the status is `loading` — i.e. the flag's value decides the root
# of the stack, which `NavigationContainer` reads exactly once (see the
# comments in `store/onboarding-context.tsx` and `navigation/AppStack.tsx`).
# Unit tests cover the context, but not that `complete()` really removes the
# screen from a mounted navigator and drops the person back where they came
# from.
#
# Starting the flow on an account that has already been through it is only
# possible via the debug "Replay onboarding" row in settings: the real flag
# (`onboarding_pending`) is set by the three `sign_up` call sites in
# `util/auth.ts` and by nothing else. That row is gated on the profile id in
# `screens/SettingsScreen.tsx` — both e2e accounts (IOS_EMAIL/ANDROID_EMAIL)
# are listed there, and on any other account this flow fails honestly on its
# very first step.
#
# The flow leaves one observation on the account: step 5 *is* the creation of
# that first record, and there is nothing here to delete it with (the species
# is picked from backend data, so the flow doesn't know its name). Neighbouring
# flows take their own baseline before their checks, so the extra record
# doesn't bother them; what accumulates is cleared by
# `.maestro/reset-state.sh`.
#
# An unfinished run is dangerous for the whole batch: `restart()` writes the
# flag to disk, so after a failure halfway through, onboarding would become the
# root of the stack for every flow after it — they would never reach MainScreen
# at all. The safety net is not this file but `common/bootstrap.yaml`: it
# closes whatever is left of the flow on entry.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
# Location is granted up front — step 4 asks for it itself, and the system
# dialog on top of the screen would swallow taps. The permission value is
# spelled differently per platform: Maestro hands it to the OS as is, and iOS
# has no "allow" (see online-create-place.yaml).
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: inuse

# The same Paris as in online-create-place.yaml: it matches the test account's
# profile country (the emulator's default point resolves to Belarus).
- setLocation:
    latitude: 48.8566
    longitude: 2.3522

- runFlow: common/bootstrap.yaml

# ---- into settings ----
# Through the drawer rather than the `dibird://my/settings` deep link: that is
# the only path to the screen a real person has. The selector is a regex
# because iOS merges the icon and the label into one accessibility element
# (see online-create-observation.yaml); "Settings" matches nothing else in the
# drawer.
- tapOn:
    id: "burger-menu-button"
- waitForAnimationToEnd
- tapOn: ".*Settings.*"
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- "Skip" on the first step ----
# A leg of its own, not a replacement for the full pass: `skip()` and
# `complete()` are two different ways out of the flow, and both must remove the
# screen from the navigator. A bug exactly here would be the most expensive
# one: someone who tapped "Skip" would be stuck in an onboarding that has no
# way out (the back gesture is disabled on it).
- tapOn: ".*Replay onboarding.*"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-1"
    timeout: 10000
- tapOn:
    id: "onboarding-skip"
# Landed back exactly where we came from — settings, not the dashboard.
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- full pass ----
- tapOn: ".*Replay onboarding.*"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-1"
    timeout: 10000
- tapOn:
    id: "onboarding-next"

- extendedWaitUntil:
    visible:
      id: "onboarding-step-2"
    timeout: 6000
- tapOn:
    id: "onboarding-next"

# Step 3, country. The account already has a country (the backend sets it by IP
# at sign-up), so the dropdown is left alone: picking in it would rewrite the
# profile, and the other flows depend on that (the territory travels into the
# global filter and from there into the editor's species dropdown). What is
# checked instead is the number under the dropdown: it comes from `/api/stat/`
# for the selected territory, which proves the step is genuinely personalized
# and not just rendering a title.
- extendedWaitUntil:
    visible:
      id: "onboarding-country-result"
    timeout: 15000
- tapOn:
    id: "onboarding-next"

# Step 4, location. The permission is already granted in launchApp, but "Allow"
# also asks for push notifications — that system dialog is still there, and
# Maestro dismisses it. optional: on the iOS simulator it doesn't always show
# up, and it has no effect on the step's outcome (`granted` is set from the
# coordinates, not from pushes).
- extendedWaitUntil:
    visible:
      id: "onboarding-step-4"
    timeout: 6000
- tapOn:
    id: "onboarding-location-allow"
- tapOn:
    text: "Allow"
    optional: true
# The step's title only changes to "You're on the map" once the coordinates
# have reached `save(..., sync: true)` and the backend has answered — so this
# checks the whole round trip "requested → got a fix → written into the alert
# settings", not the fact of a tap.
- extendedWaitUntil:
    visible: ".*on the map.*"
    timeout: 20000
- tapOn:
    id: "onboarding-next"

# Step 5, the first observation. What is waited for is the search dropdown: it
# renders as soon as both of the step's requests are done, and it exists in
# both layout variants — with the species tiles and without them. While
# loading, the screen is only a spinner, and without this wait the branches
# below would fan out over an empty screen.
- extendedWaitUntil:
    visible:
      id: "dropdown-trigger-SpeciesDropdown"
    timeout: 25000

# The tiles are built from the community's recent observations in the country
# and only appear from three species up (MIN_CARDS) — on a local backend they
# are usually missing, on live data they are there. The order of the branches
# is not accidental: "no tiles → search" is checked first, while the step
# itself is still on screen. The reverse order would race itself — after a tap
# on a card the tiles disappear together with the step, and the second "no
# tiles" branch would fire on the success screen instead.
- runFlow:
    when:
      notVisible:
        id: "onboarding-species-\\d+"
    commands:
      - tapOn:
          id: "dropdown-trigger-SpeciesDropdown"
      - extendedWaitUntil:
          visible:
            id: "option-row-0"
          timeout: 15000
      # The first species in the list: the set depends on the country's
      # checklist, and the flow checks that a record is created, not which bird
      # it is.
      - tapOn:
          id: "option-row-0"
- runFlow:
    when:
      visible:
        id: "onboarding-species-\\d+"
    commands:
      - tapOn:
          id: "onboarding-species-\\d+"

# The success screen is the proof that the observation really was created:
# `setCreated` is called from the mutation's `onSuccess`, not on tap.
- extendedWaitUntil:
    visible:
      id: "onboarding-success"
    timeout: 20000
- tapOn:
    id: "onboarding-next"

# `complete()` removes the screen from the navigator — and the stack falls back
# to the settings the flow was started from.
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- the flag really is cleared ----
# Not "the status in memory" but the record on disk: `complete()` clears
# `onboarding_pending`, and a relaunch is the only way to see that. The real
# check here is that bootstrap reached MainScreen at all: with the flag still
# set, `Onboarding` would be the root of the stack again, and there is simply
# no dashboard in it.
- launchApp
- runFlow: common/bootstrap.yaml
- assertNotVisible:
    id: "onboarding-step-1"
