# Онбординг нового аккаунта целиком: «Пропустить» на первом шаге, затем полный
# проход — две страницы ценности, страна, геолокация, первое наблюдение — и
# проверка, что после этого поток не возвращается.
#
# Устройство тут не роскошь: почти всё, что может сломаться в онбординге,
# ломается именно на стыке навигатора и статуса потока, а не внутри экрана.
# `AppStack` объявляет `Onboarding` первым и рендерит `null`, пока статус
# `loading`, — то есть от значения флага зависит корень стека, который
# `NavigationContainer` читает один раз (см. комментарии в
# `store/onboarding-context.tsx` и `navigation/AppStack.tsx`). Юнит-тесты
# проверяют контекст, но не то, что `complete()` действительно убирает экран из
# смонтированного навигатора и высаживает человека туда, откуда он пришёл.
#
# Начать поток на аккаунте, который его уже прошёл, можно только отладочной
# строкой «Replay onboarding» в настройках: настоящий флаг
# (`onboarding_pending`) ставят три точки `sign_up` в `util/auth.ts` и больше
# никто. Строка спрятана за гейтом по id профиля в `screens/SettingsScreen.tsx`
# — оба e2e-аккаунта (IOS_EMAIL/ANDROID_EMAIL) в нём перечислены, и на чужом
# аккаунте этот флоу честно упадёт на первом же шаге.
#
# Флоу оставляет на аккаунте одно наблюдение: шаг 5 — это и есть создание
# первой записи, и удалять её отсюда нечем (вид выбирается из данных бэка, его
# имени флоу не знает). Соседние флоу берут собственный baseline перед своими
# проверками, так что лишняя запись им не мешает; накопленное убирает
# `.maestro/reset-state.sh`.
#
# Незавершённый прогон опасен для всего батча: `restart()` пишет флаг на диск, и
# после падения в середине онбординг стал бы корнем стека для каждого
# следующего флоу — до MainScreen они бы просто не добрались. Страхует не этот
# файл, а `common/bootstrap.yaml`: он гасит оставшийся поток на входе.
#
# appId приходит из run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
# Гео выдаём заранее — шаг 4 просит его сам, и системный диалог поверх экрана
# перехватил бы тапы. Значение платформы пишутся по-разному: Maestro отдаёт его
# в ОС как есть, а у iOS нет «allow» (см. online-create-place.yaml).
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: inuse

# Тот же Париж, что в online-create-place.yaml: совпадает со страной профиля
# тестового аккаунта (дефолтная точка эмулятора резолвится в Беларусь).
- setLocation:
    latitude: 48.8566
    longitude: 2.3522

- runFlow: common/bootstrap.yaml

# ---- в настройки ----
# Через drawer, а не диплинком `dibird://my/settings`: это единственный путь к
# экрану у живого человека. Селектор — регуляркой, потому что iOS склеивает
# иконку с подписью в один accessibility-элемент (см.
# online-create-observation.yaml); в drawer'е «Settings» больше ни во что не
# попадает.
- tapOn:
    id: "burger-menu-button"
- waitForAnimationToEnd
- tapOn: ".*Settings.*"
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- «Пропустить» на первом шаге ----
# Отдельной ногой, а не вместо полного прохода: `skip()` и `complete()` — два
# разных выхода из потока, и оба обязаны убрать экран из навигатора. Ошибка
# ровно здесь и была бы самой дорогой: человек, нажавший «Пропустить», застрял
# бы в онбординге, из которого выхода уже нет (жест «назад» на нём выключен).
- tapOn: ".*Replay onboarding.*"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-1"
    timeout: 10000
- tapOn:
    id: "onboarding-skip"
# Вернулись ровно туда, откуда пришли, — на настройки, а не на дашборд.
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- полный проход ----
- tapOn: ".*Replay onboarding.*"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-1"
    timeout: 10000
- tapOn:
    id: "onboarding-next"

- extendedWaitUntil:
    visible:
      id: "onboarding-step-2"
    timeout: 6000
- tapOn:
    id: "onboarding-next"

# Шаг 3, страна. Страна у аккаунта уже проставлена (бэк ставит её по IP при
# регистрации), поэтому дропдаун не трогаем: выбор в нём переписал бы профиль,
# а от него зависят и остальные флоу (территория едет в глобальный фильтр и
# оттуда — в species-дропдаун редактора). Проверяем цифру под дропдауном: она
# приходит с `/api/stat/` по выбранной территории, то есть подтверждает, что
# шаг действительно персонализирован, а не просто отрисовал заголовок.
- extendedWaitUntil:
    visible:
      id: "onboarding-country-result"
    timeout: 15000
- tapOn:
    id: "onboarding-next"

# Шаг 4, геолокация. Разрешение уже выдано в launchApp, но «Разрешить» просит
# ещё и пуши — этот системный диалог остаётся, и Maestro его закрывает.
# optional: на iOS-симуляторе он не всегда доходит, а на результат шага не
# влияет (`granted` ставится по координатам, не по пушам).
- extendedWaitUntil:
    visible:
      id: "onboarding-step-4"
    timeout: 6000
- tapOn:
    id: "onboarding-location-allow"
- tapOn:
    text: "Allow"
    optional: true
# Заголовок шага меняется на «You're on the map» только после того, как
# координаты доехали до `save(..., sync: true)` и бэк ответил, — то есть это
# проверка круга «запросили → получили фикс → записали в настройки алертов»,
# а не факта тапа.
- extendedWaitUntil:
    visible: ".*on the map.*"
    timeout: 20000
- tapOn:
    id: "onboarding-next"

# Шаг 5, первое наблюдение. Ждём именно дропдаун поиска: он рендерится, как
# только оба запроса шага отработали, и есть в обоих вариантах вёрстки — и с
# плиткой видов, и без неё. Пока идёт загрузка, на экране только спиннер, и без
# этого ожидания ветки ниже разошлись бы по пустому экрану.
- extendedWaitUntil:
    visible:
      id: "dropdown-trigger-SpeciesDropdown"
    timeout: 25000

# Плитка собирается из недавних наблюдений сообщества в стране и появляется
# только от трёх видов (MIN_CARDS) — на локальном бэке её обычно нет, на живых
# данных она есть. Порядок веток не случаен: «нет плитки → поиск» проверяется
# первым, пока на экране ещё сам шаг. Обратный порядок гонялся бы сам с собой —
# после тапа по карточке плитка исчезает вместе с шагом, и вторая ветка
# «плитки нет» сработала бы уже на экране успеха.
- runFlow:
    when:
      notVisible:
        id: "onboarding-species-\\d+"
    commands:
      - tapOn:
          id: "dropdown-trigger-SpeciesDropdown"
      - extendedWaitUntil:
          visible:
            id: "option-row-0"
          timeout: 15000
      # Первый вид в списке: набор зависит от чек-листа страны, флоу проверяет
      # создание записи, а не конкретную птицу.
      - tapOn:
          id: "option-row-0"
- runFlow:
    when:
      visible:
        id: "onboarding-species-\\d+"
    commands:
      - tapOn:
          id: "onboarding-species-\\d+"

# Экран успеха — доказательство, что наблюдение действительно создано:
# `setCreated` вызывается из `onSuccess` мутации, а не по тапу.
- extendedWaitUntil:
    visible:
      id: "onboarding-success"
    timeout: 20000
- tapOn:
    id: "onboarding-next"

# `complete()` убирает экран из навигатора — и стек падает обратно на
# настройки, с которых поток и запускали.
- extendedWaitUntil:
    visible: ".*Replay onboarding.*"
    timeout: 10000

# ---- флаг действительно погашен ----
# Не «статус в памяти», а запись на диске: `complete()` чистит
# `onboarding_pending`, и перезапуск — единственный способ это увидеть. Настоящая
# проверка тут — что bootstrap вообще дошёл до MainScreen: с непогашенным флагом
# `Onboarding` снова стал бы корнем стека, и дашборда в нём просто нет.
- launchApp
- runFlow: common/bootstrap.yaml
- assertNotVisible:
    id: "onboarding-step-1"
