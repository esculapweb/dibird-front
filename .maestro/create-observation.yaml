# Core flow: create an Observation while online.
#
# Fast reuse-the-session login, not a full login test (see login.yaml for
# that, including its wrong-password check). No clearKeychain/clearState:
# expo-secure-store keeps the token in Keychain across relaunches, so a
# prior login on this simulator lands straight on MainScreen with no
# typing — the runFlow/when.visible block below is only the fallback for
# a first run or after logout, sharing common/ios-credential-entry.yaml
# with login.yaml.
#
# Starts from MainScreen's "+ Observation" quick action, not the
# Observations list — the shortest real user path, and the one where
# territory arrives pre-filled.
#
# Country isn't picked manually: after login, profile-context's
# initGlobalFilters sets the global territory filter to the profile's own
# country, and ObservationEditorScreen seeds the form from it — if that
# invariant ever breaks, the species dropdown (gated on territory) won't
# open and this flow fails loudly right there.
#
# Picks the first available species (dropdown contents are backend/seed-
# data dependent) — this verifies the save round-trip, not a species.
#
# appId matches the dev-client build (com.dibird.app.dev).
# tags: ios — see login.yaml.
appId: com.dibird.app.dev
tags:
  - ios
---
- launchApp

- runFlow: common/ios-bootstrap.yaml

# Fallback: full email+password entry when no session was restored.
- runFlow:
    when:
      visible: ".*Continue with email.*"
    file: common/ios-credential-entry.yaml

# A warm relaunch can reopen on whatever screen was last open (React
# Navigation restore), not necessarily MainScreen — pop back (bounded,
# not blind, since BackButton at the stack root would no-op) until the
# MainScreen-only quick action appears. Uses id: "BackButton" (the
# native-stack header back button) rather than Maestro's `back` command:
# iOS has no system-level back gesture for `back` to invoke.
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- assertVisible:
    id: "quick-action-observation"

- tapOn:
    id: "quick-action-observation"

- tapOn:
    id: "species-dropdown-trigger"
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 8000
- tapOn:
    id: "option-row-0"
- tapOn:
    id: "observation-save-button"
# The floating dev-tools trigger sits on top of the header's save button
# on this screen size — every tap there opens the "DiBird (Dev)" menu
# instead of submitting. Disable the trigger permanently, then dismiss.
- runFlow:
    when:
      visible: "Reload"
    commands:
      # Switch has no accessible text of its own — tap its known
      # on-screen position instead of the (untappable) label.
      - tapOn:
          point: "85%,95%"
      - tapOn:
          text: "Close"
      - tapOn:
          id: "observation-save-button"

# A successful save lands on the new observation's detail screen. Assert
# on the delete button specifically: it only renders when is_owner is
# true on a real persisted item, confirming the save reached the server.
- assertVisible: ".*Delete observation.*"
