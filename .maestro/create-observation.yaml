# Core user flow: create an Observation while online.
#
# Login here is a fast reuse-the-session preamble, not a full login test
# (that's login.yaml's job, including its deliberate wrong-password check —
# reusing it via runFlow would double this flow's time just to get past the
# auth gate). No clearKeychain / clearState: expo-secure-store keeps the
# access token in the Keychain across app relaunches, and auth-context.tsx's
# restoreToken effect reads it back on boot — so if an earlier run (in this
# suite or a previous one) already logged in on this simulator, launchApp
# alone lands straight on MainScreen with no typing at all. The
# runFlow/when.visible block below only runs the real email+password steps
# as a fallback, for a first-ever run or after an explicit logout. This
# preamble is meant to be copy-pasted into other test flows verbatim (see
# login.yaml for the shared selector notes — kept in sync manually since
# Maestro's directory-based test runner (`maestro test .maestro`, see
# run.sh) scans every yaml file under the given path and requires each one
# to have its own appId/config header, so a shared no-header "partial" file
# placed anywhere under .maestro/ either errors out on its own or, if given
# a header to fix that, ends up running as its own redundant top-level flow
# either way).
#
# Goes straight from MainScreen's "+ Observation" quick action rather than
# Observations list -> add button: that's the shortest real path a user
# takes, and it also happens to be the one path where the territory field
# arrives pre-filled (see below), so there's no list screen or empty-state
# branching to handle here at all.
#
# Country is deliberately NOT selected in this flow: after login,
# profile-context's initGlobalFilters sets the global territory filter to
# the profile's own country, and ObservationEditorScreen seeds the form from
# that same filter as `defaultTerritory` — so the country arrives
# pre-selected before the form even mounts. If that invariant ever breaks,
# the species dropdown (gated on territory being set) simply won't open and
# this flow fails loudly at that step instead of silently mis-testing.
#
# Picks the first available species rather than a specific one, since exact
# dropdown contents are backend/seed-data dependent — this flow verifies the
# save round-trip, not a particular species.
#
# appId matches the dev-client build (com.dibird.app.dev) — see login.yaml.
#
# Run with:
#   maestro test --env TEST_EMAIL=... --env TEST_PASSWORD=... .maestro/create-observation.yaml
#
# tags: ios — see login.yaml's equivalent comment.
appId: com.dibird.app.dev
tags:
  - ios
---
- launchApp

- tapOn:
    below: "DEVELOPMENT SERVERS"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn:
          text: "Tools button"
      - back

# Fallback only: runs the full email+password entry when no valid session
# was restored (Welcome screen still showing). Skipped entirely on the
# common case where a prior run already left a valid token in the Keychain.
- runFlow:
    when:
      visible: ".*Continue with email.*"
    commands:
      - tapOn: ".*Continue with email.*"
      - tapOn:
          id: "email-input"
      - setClipboard: "${TEST_EMAIL}"
      - pasteText
      - tapOn:
          id: "password-input"
      - tapOn:
          id: "password-input-toggle-visibility"
      - tapOn:
          id: "password-input"
      - setClipboard: "${TEST_PASSWORD}"
      - pasteText
      - hideKeyboard
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - tapOn:
          text: "Not Now"
          optional: true

# React Navigation restores whatever screen was open when the app was last
# backgrounded/killed on a warm relaunch (no clearState, same reasoning as
# the header comment above) — it does NOT necessarily land on MainScreen,
# it can reopen directly on whatever screen a previous run left the app on
# (observed: opened straight onto the Rating screen). Give MainScreen's
# initial render a real chance to land first (optional, so it doesn't fail
# outright if we're genuinely on some other screen), then pop back a
# bounded number of times — not blindly, since tapping this at the stack
# root would just no-op (no back button rendered there), settling briefly
# after each tap so one that DID reach MainScreen isn't immediately
# followed by another premature tap while it's still mid-render.
#
# Uses id: "BackButton" (react-navigation's native-stack header back button,
# rendered by both AppStack and AuthStack via headerBackButtonDisplayMode —
# see navigation/AppStack.tsx/AuthStack.tsx — so it's present on any pushed
# screen, not app-authored) rather than Maestro's generic `back` command:
# unlike Android, iOS has no system-level back button/gesture for `back` to
# invoke — see offline-create-observation.yaml's equivalent comment (the
# Android counterpart of this exact fix) for the underlying navigation-
# restore issue this addresses.
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- assertVisible:
    id: "quick-action-observation"

- tapOn:
    id: "quick-action-observation"

- tapOn:
    id: "species-dropdown-trigger"
# Species list is already scoped to the pre-filled territory (a much smaller,
# targeted fetch than the full ~250-country list), so a short wait is enough
# here — no need for the country dropdown's longer cold-cache allowance.
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 8000
- tapOn:
    id: "option-row-0"
- tapOn:
    id: "observation-save-button"
# The floating dev-tools trigger button sits right on top of the header's
# own save button on this screen size (same issue as the Android flows deal
# with — see offline-create-observation.yaml's equivalent guard): every tap
# there opens the native "DiBird (Dev)" menu instead of submitting, not just
# a one-off mistap — confirmed by this recurring identically on a retry
# that only dismissed and re-tapped without disabling the trigger. Detected
# via "Reload", unique to that menu. Toggles the "Tools button" switch off
# first (permanently hides the floating trigger for the rest of the run,
# same as Android's proactive disable), then dismisses via the sheet's
# "Close" button (accessibility text, confirmed via `maestro hierarchy`)
# rather than Android's `back` — iOS has no system-level back gesture for
# Maestro's `back` command to invoke.
- runFlow:
    when:
      visible: "Reload"
    commands:
      # The switch itself has no accessible text of its own (confirmed via
      # `maestro hierarchy`) — it's a separate element to the right of the
      # "Tools button" label, not the label itself, so tapping the label
      # text (Android's approach, where they're the same tappable row)
      # leaves the switch untouched and this menu keeps reopening on every
      # retry. `rightOf: "Tools button"` also missed it (still landed
      # outside the switch's real hit-testable bounds) — tap its exact
      # center instead, computed from `maestro hierarchy`'s reported bounds
      # ([342,897]-[403,924] in this menu's 440x956 point space).
      - tapOn:
          point: "85%,95%"
      - tapOn:
          text: "Close"
      - tapOn:
          id: "observation-save-button"

# A successful save navigates to the new observation's own detail screen
# (ObservationEditorScreen's onSuccess replaces the route rather than just
# going back, since this flow doesn't pass returnMode: "back"). Assert on
# that screen's delete button specifically: it only renders when
# observation.is_owner is true on a real, persisted item, so its presence is
# direct confirmation the observation was actually created server-side — not
# just that the editor closed.
- assertVisible: ".*Delete observation.*"
