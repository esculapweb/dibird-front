# Core flow: full create -> update -> delete lifecycle for an Observation
# while online, on iOS. Android already has this full lifecycle
# (online-create-observation.yaml); this file used to cover create only —
# update/delete were left as a manual checklist item (RELEASE_CHECKLIST.md
# §4) purely because no one had gotten to the iOS parity yet, not because
# of any platform limitation like the offline/airplane-mode gap (see §6).
#
# Fast reuse-the-session login, not a full login test (see login.yaml for
# that, including its wrong-password check). No clearKeychain/clearState:
# expo-secure-store keeps the token in Keychain across relaunches, so a
# prior login on this simulator lands straight on MainScreen with no
# typing — the runFlow/when.visible block below is only the fallback for
# a first run or after logout, sharing common/ios-credential-entry.yaml
# with login.yaml.
#
# Starts from MainScreen's "+ Observation" quick action, not the
# Observations list — the shortest real user path, and the one where
# territory arrives pre-filled.
#
# Country isn't picked manually: after login, profile-context's
# initGlobalFilters sets the global territory filter to the profile's own
# country, and ObservationEditorScreen seeds the form from it — if that
# invariant ever breaks, the species dropdown (gated on territory) won't
# open and this flow fails loudly right there.
#
# Picks the first available species (dropdown contents are backend/seed-
# data dependent) — this verifies the save round-trip, not a species.
#
# appId matches the dev-client build (com.dibird.app.dev).
# tags: ios — see login.yaml.
appId: com.dibird.app.dev
tags:
  - ios
---
- launchApp

- runFlow: common/ios-bootstrap.yaml

# Fallback: full email+password entry when no session was restored.
- runFlow:
    when:
      visible: ".*Continue with email.*"
    file: common/ios-credential-entry.yaml

# A warm relaunch can reopen on whatever screen was last open (React
# Navigation restore), not necessarily MainScreen — pop back (bounded,
# not blind, since BackButton at the stack root would no-op) until the
# MainScreen-only quick action appears. Uses id: "BackButton" (the
# native-stack header back button) rather than Maestro's `back` command:
# iOS has no system-level back gesture for `back` to invoke.
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - tapOn:
          id: "BackButton"
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- assertVisible:
    id: "quick-action-observation"

- tapOn:
    id: "quick-action-observation"

- tapOn:
    id: "species-dropdown-trigger"
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 6000
- tapOn:
    id: "option-row-0"
# The floating dev-tools gear used to sit on top of the header's save
# button on this screen size, so every tap here opened the "DiBird (Dev)"
# menu instead of submitting. common/ios-bootstrap.yaml now disables that
# gear and asserts it is gone before this flow gets here — no recovery
# branch needed on either save.
- tapOn:
    id: "observation-save-button"

# A successful save lands on the new observation's detail screen. Assert
# on the delete button specifically: it only renders when is_owner is
# true on a real persisted item, confirming the save reached the server.
- assertVisible: ".*Delete observation.*"

# ---- UPDATE, online ----
# Mirrors online-create-observation.yaml's UPDATE step — same testIDs,
# same "Private" assertion — just without ever touching
# toggleAirplaneMode (unsupported on iOS Simulator, see the file header).
#
# Unlike Android, iOS's accessibility tree merges the PrivacyToggle's
# icon + label + description into one element (e.g. ", Public, Visible
# to everyone"), so a bare "Public"/"Private" regex never matches the
# whole string — wrap in .* like the "Delete observation" assertion
# above does for the same reason.
- tapOn:
    id: "observation-edit-button"
- waitForAnimationToEnd
- tapOn:
    text: ".*Public.*"
- tapOn:
    id: "observation-save-button"
- assertVisible: ".*Private.*"

# ---- DELETE, online ----
- tapOn:
    id: "observation-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
# Delete's onSuccess is a plain goBack() straight to MainScreen — this flow
# opened the editor from MainScreen's quick action with no list ever
# pushed in between, same as the Android counterpart.
- assertVisible:
    id: "quick-action-observation"
