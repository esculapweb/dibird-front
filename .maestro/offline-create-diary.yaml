# Device-level offline test: full create -> update -> delete lifecycle for
# a Diary in real airplane mode, with a reconnect between each step. See
# offline-create-observation.yaml for the full shared rationale (Android-
# only, real toggleAirplaneMode, session reuse, count-based delete proof).
#
# DiaryEditorScreen only requires territory/date_time, both pre-filled
# (territory from the profile's default, date_time defaults to "now") —
# so the form is saveable immediately with no extra taps.
#
# appId is the single Android package for every build variant.
# tags: android — see login.yaml.
appId: com.dibird.app
tags:
  - android
---
# No clearState: session reuse — see offline-create-observation.yaml. The
# local mutation-queue db also isn't reset between flows, so this flow's
# own create->update->delete cycle must net to zero on its own.
- launchApp

- runFlow: common/android-bootstrap.yaml

# Real budget for the login POST round-trip — plain assertVisible was
# observed racing it. Waits on the stat card's own testID rather than
# ".*Observations.*" text, which also matches an unrelated grid label.
- extendedWaitUntil:
    visible:
      id: "diaries-stat-value"
    timeout: 20000

# Capture the server-truth count now — real proof the delete at the end
# reached the server, not just that its confirm dialog was tapped.
- copyTextFrom:
    id: "diaries-stat-value"
# maestro.copiedText is clipboard-backed, not a dedicated result slot —
# stash it in the `output` store before a later setClipboard can clobber it.
- evalScript: ${output.diaryBaselineCount = maestro.copiedText}

# ---- CREATE, offline ----
- toggleAirplaneMode

- tapOn:
    id: "quick-action-diary"
- tapOn:
    id: "diary-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "diary-save-button"

# Local-first create lands on the (temp-id) detail screen even offline —
# used as a wait gate before `back`.
#
# Bigger budget than the observation/place flows' identical gate (6s):
# this screen is a ListScreen, so nothing at all renders — header and
# delete button included — until its observations query settles. That used
# to mean a ~10s wait offline (the doomed request burned api.ts's full
# `timeout: 10000` before the cache fallback ran); fetchAbstract now skips
# the request outright when NetInfo says offline and locally-known data
# exists, which brings first paint back down to "as fast as navigation".
# Kept generous anyway — the screen still waits on a query, and a loaded
# CI emulator is slower than this one.
- extendedWaitUntil:
    visible: ".*Delete diary.*"
    timeout: 25000
- back
- tapOn:
    text: "Diaries"
- assertVisible:
    id: "diary-sync-pending-icon"

# Tap the pending icon to reopen the detail screen — reliable only before
# reconnecting, since a pending create is always prepended to page 1.
- tapOn:
    id: "diary-sync-pending-icon"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- UPDATE, offline ----
- toggleAirplaneMode
- tapOn:
    id: "diary-edit-button"
- waitForAnimationToEnd
# Toggle privacy (defaults to "Public") — a deterministic field to assert
# against, unlike the pending icon's list position.
- tapOn:
    text: "Public"
- tapOn:
    id: "diary-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "diary-save-button"
- assertVisible: "Private"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- DELETE, offline ----
- toggleAirplaneMode
- tapOn:
    id: "diary-delete-button"
# Confirm sheet slides up asynchronously — wait for it, don't race it.
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
# Delete's onSuccess navigates back to the Diaries list this screen was
# opened from.
- assertVisible: ".*Diaries.*"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

- back
- assertVisible:
    id: "diaries-stat-value"
    text: ${output.diaryBaselineCount}
