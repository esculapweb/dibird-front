# The change-password screen: which form it shows, and that a wrong current
# password is refused by the server.
#
# It deliberately never completes a change. The batch shares one account per
# platform and its password lives in `.maestro/.env.local`; a flow that changed
# it and then died anywhere before changing it back would lock every later flow
# — and every later run — out of the account, recoverable only by editing that
# file by hand. The happy path is covered where it is cheap and safe to cover:
# `myapi/tests/test_password_api.py` on the backend and
# `screens/__tests__/ChangePasswordScreen.test.tsx` in the app.
#
# What is left is still the part device tests are for:
#  - the screen asks for a *current* password at all. That field is drawn only
#    when `has_usable_password` comes back true from `/myapi/profile/me/`, so
#    seeing it proves the fetch happened and the flag survived serialization.
#    An account signed in with Google gets the other form, and sending an
#    old_password there is a 400 — the two must not be confused;
#  - `POST /api-auth/password/change/` reaches a real backend and its refusal
#    surfaces as a readable message rather than a silent nothing. That the
#    endpoint demands the old password at all is a settings-level decision
#    (`OLD_PASSWORD_FIELD_ENABLED`), invisible to any client-side test.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
# No clearState: session reuse, like every other signed-in flow.
- launchApp

- runFlow: common/bootstrap.yaml

# ---- into Settings -> Security ----
- tapOn:
    id: "burger-menu-button"
- waitForAnimationToEnd
- tapOn: ".*Settings.*"
# scrollUntilVisible rather than a bare wait: `tapOn` does not scroll, and an
# off-screen row reads as "element not found", indistinguishable from a typo.
# The Security section sits second on the screen so it is normally in view
# already — and then this is a no-op — but the sections above it grow with the
# account (the debug push row, the biometric switch), which is exactly how
# online-create-place started failing on iOS.
- scrollUntilVisible:
    element: ".*Change password.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Change password.*"

# ---- the form for an account that has a password ----
# The screen fetches the profile before it can decide which form to draw, so
# this waits on a request, not on an animation.
- extendedWaitUntil:
    visible:
      id: "current-password-input"
    timeout: 15000
- assertVisible:
    id: "new-password-input"
- assertVisible:
    id: "new-password-confirm-input"
# The wording follows the same flag. "Set password" would mean the app decided
# this account has none — and then it would omit old_password and earn a 400.
- assertVisible: ".*Enter your current password.*"

# ---- a mismatched confirmation never reaches the server ----
- tapOn:
    id: "current-password-input"
- setClipboard: "${TEST_PASSWORD}"
- pasteText
- tapOn:
    id: "new-password-input"
- setClipboard: "e2e-not-the-real-one"
- pasteText
- tapOn:
    id: "new-password-confirm-input"
- setClipboard: "e2e-something-else"
- pasteText
# Defocus before submitting — see common/credential-entry.yaml on why
# hideKeyboard is avoided on this Input.
- tapOn:
    text: ".*Enter your current password.*"
    optional: true
- tapOn:
    id: "change-password-submit-button"
- extendedWaitUntil:
    visible: ".*Passwords don.t match.*"
    timeout: 6000
# Still on the form. The screen only leaves once the change went through, so
# this is what would fail if a mismatch were ever sent and accepted.
- assertVisible:
    id: "change-password-submit-button"

# ---- a wrong current password is refused by the server ----
# The two new fields now match, so the only thing left for the request to trip
# over is the old password — which is deliberately wrong.
- tapOn:
    id: "new-password-confirm-input"
- eraseText
- setClipboard: "e2e-not-the-real-one"
- pasteText
- tapOn:
    id: "current-password-input"
- eraseText
- setClipboard: "e2e-definitely-wrong"
- pasteText
- tapOn:
    text: ".*Enter your current password.*"
    optional: true
- tapOn:
    id: "change-password-submit-button"

# The refusal is the server's, not the form's: it has to travel back and be
# rendered as something a person can act on. Generous timeout — a real round
# trip to the local Django.
- extendedWaitUntil:
    visible: ".*Couldn.t change the password.*"
    timeout: 20000
# And nothing was changed: still on the form, and the session is still the one
# the rest of the batch signs in with.
- assertVisible:
    id: "change-password-submit-button"

# ---- back to where the batch expects to find the app ----
- runFlow: common/back.yaml
- runFlow: common/back.yaml
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 15000
