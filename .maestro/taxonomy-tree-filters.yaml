# The catalogue's own navigation: the taxonomic tree, the trait filters, and
# the species comparison — the three entry points on the species root that no
# flow touched before. guest-browse.yaml covers the search box and a species
# page; everything a user does to *narrow down* the catalogue was untested.
#
# Reached from MainScreen's "Birds of the world" card rather than the drawer
# item of the same name: DrawerItem taps are unreliable on Android (Maestro
# reports COMPLETED and nothing navigates — see settings-language-switch.yaml).
#
# The filter sheet is driven entirely by its visible labels, not by the
# testIDs it does carry: iOS collapses a gorhom sheet's contents into one
# accessibility element, and only the pressables survive it — as buttons with
# a label (same limitation list-sort-persist.yaml ran into). The rows here are
# all pressables, so labels are enough. What the filter actually did is then
# asserted *outside* the sheet, on the chips row, where testIDs work again.
#
# The group filter (order -> family) is the one part driven by testIDs inside
# the sheet: its dropdown triggers carry no label of their own beyond the
# current value, and the choices open in a modal outside the sheet anyway.
#
# Body mass is the group it opens: its chips come from a static bucket list
# (components/Taxonomy/taxonTraitConfig.ts), unlike habitat/migration/etc.,
# whose contents come from the backend vocabulary and can legitimately be
# empty on a given dataset.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp

- runFlow: common/bootstrap.yaml

- scrollUntilVisible:
    element: ".*Birds of the world.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Birds of the world.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Search a species by name.*"
    timeout: 15000

# ---- the tree: species root -> the orders/families view ----
- tapOn: ".*By groups.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "items-list"
    timeout: 15000
- runFlow: common/back.yaml
- extendedWaitUntil:
    visible: ".*Search a species by name.*"
    timeout: 10000

# ---- trait filters ----
- tapOn:
    id: "filter-button"
- extendedWaitUntil:
    visible:
      id: "taxon-filter-apply-button"
    timeout: 6000
# Groups start collapsed — open Body mass, then pick one of its buckets.
- tapOn: ".*Body mass.*"
- waitForAnimationToEnd
- tapOn: ".*over 1 kg.*"
- tapOn:
    id: "taxon-filter-apply-button"
- waitForAnimationToEnd

# Outside the sheet again: the active filter shows up as a removable chip,
# and the list under it is the server's filtered answer rather than the
# unfiltered catalogue it was showing a moment ago.
- extendedWaitUntil:
    visible:
      id: "remove-taxon-filter-mass"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "items-list"
    timeout: 15000

# Removing the chip puts the catalogue back — and leaves nothing behind for
# the next flow, since the filter lives in screen state, not on disk.
- tapOn:
    id: "remove-taxon-filter-mass"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "remove-taxon-filter-mass"
    timeout: 6000

# ---- group filter: order -> family ----
# The sheet's three group dropdowns (TaxonFilterSheet) load their choices from
# the backend (useTaxonGroupOptions), the family list keyed by the picked
# order. Emu and cassowaries is the order to pick because its answer is tiny
# and settled: one family, four species. A single row in the family list is
# what proves the narrowing — with no order picked it lists all ~250.
- tapOn:
    id: "filter-button"
- extendedWaitUntil:
    visible:
      id: "taxon-filter-apply-button"
    timeout: 6000
- tapOn:
    id: "dropdown-trigger-TaxonOrderDropdown"
- extendedWaitUntil:
    visible: "Emu and cassowaries"
    timeout: 15000
- tapOn: "Emu and cassowaries"
- waitForAnimationToEnd
- tapOn:
    id: "dropdown-trigger-TaxonFamilyDropdown"
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 15000
- assertNotVisible:
    id: "option-row-1"
- tapOn: "Cassowaries, Emu"
- waitForAnimationToEnd
- tapOn:
    id: "taxon-filter-apply-button"
- waitForAnimationToEnd

# One chip per level, each with the group's name rather than the "…" it
# shows until the options are in. Partial match: on iOS the chip's label also
# carries the remove icon's glyph ("Order: Emu and cassowaries, ").
- extendedWaitUntil:
    visible: ".*Order: Emu and cassowaries.*"
    timeout: 10000
- assertVisible: ".*Family: Cassowaries, Emu.*"
- extendedWaitUntil:
    visible: "Found: 4"
    timeout: 15000

# Dropping the order leaves the family (TaxonFilterChips): a family alone
# still says which birds these are, so the list stays the same four.
- tapOn:
    id: "remove-taxon-filter-order"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "remove-taxon-filter-order"
    timeout: 6000
- assertVisible:
    id: "remove-taxon-filter-family"
- extendedWaitUntil:
    visible: "Found: 4"
    timeout: 15000
- tapOn:
    id: "remove-taxon-filter-family"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "remove-taxon-filter-family"
    timeout: 6000

# ---- species comparison ----
- tapOn: ".*Compare species.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "compare-scroll"
    timeout: 15000
- assertVisible:
    id: "compare-pick-a"
- runFlow: common/back.yaml

- runFlow: common/back.yaml
# Scroll back up before asserting: MainScreen keeps the scroll position from
# the scrollUntilVisible at the top of this flow (it went down to the
# catalogue card), and the quick actions sit near the very top — present in
# the hierarchy on return, but off-screen, which is what Maestro reports as
# not visible. Same trap as in settings-language-switch.yaml and
# offline-nested-observation-in-diary.yaml; this flow was passing on it by
# luck. scrollUntilVisible is a no-op when the button is already in view.
- scrollUntilVisible:
    element:
      id: "quick-action-observation"
    direction: UP
    timeout: 10000
- assertVisible:
    id: "quick-action-observation"
