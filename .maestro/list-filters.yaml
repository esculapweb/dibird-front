# Filtering a list, and getting back out of it.
#
# The filter sheet (components/Filters/FilterSheetContent.tsx) is shared by
# every list screen and had no device coverage: unit tests exercise the
# controls, but not that the chosen filter reaches the query, changes what the
# list fetches, and is reflected by the header badge — the badge in particular
# is a separate count that has gone stale on its own before.
#
# Filters on sync status rather than on a real value: the flow shares one
# account with every other flow here, and they all clean up after themselves,
# so the list's contents — even whether it is empty — are not something to
# assert against. "Unsynced only" is the one filter with a guaranteed answer
# while online: nothing is pending, so the list must come back empty, and the
# badge must agree. That holds whatever the account happens to contain.
#
# Driven by the sheet's visible labels. Maestro matches text selectors in
# full, so "All" hits the Sync status option and not "All locations"/
# "All species"/"All time".
#
# Apply is the exception and goes by id. Picking "Unsynced only" paints the
# hint "Showing unsynced records only — the other filters do not apply" over
# the Location and Species dropdowns, and ".*Apply.*" matches that sentence
# too — earlier in the hierarchy than the button. The tap then landed on a
# dropdown that is disabled in exactly this state, so nothing happened at
# all and the flow failed further down, on the empty state that never came.
#
# tags: android only. On iOS *nothing* inside this particular sheet reaches
# the accessibility hierarchy — not the options, not even its Apply button —
# while the taxonomy filter sheet right next door is fully addressable
# (taxonomy-tree-filters.yaml drives it on both platforms). The difference
# between them is the shared title block: this one is opened with a `title`,
# which wraps the content in UniversalBottomSheet's own header container. It
# is worth knowing that this is not only a testing problem — content that
# Maestro cannot see through the accessibility tree is content VoiceOver
# cannot read either. Flagged, not worked around here.
#
# Cleared through the sheet, not through the empty state's "Reset filters"
# button: that one resets *every* filter, including the global country and
# period the other flows depend on (ObservationEditor seeds its territory
# from them).
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - android
---
- launchApp

- runFlow: common/bootstrap.yaml

# The section grid sits below the fold: the dashboard's height follows the
# account's own data, so the tile is not reliably in view (see the longer
# note in online-create-place.yaml). No-op when it already is.
- scrollUntilVisible:
    element:
      id: "section-Observations"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Observations"
- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 15000
- copyTextFrom:
    id: "list-header-badge-count"
- evalScript: ${output.observationsBaselineBadge = maestro.copiedText}

# ---- filter it down to nothing ----
- tapOn:
    id: "filter-button"
- extendedWaitUntil:
    visible:
      id: "filter-apply-button"
    timeout: 6000
- tapOn: "Unsynced only"
- tapOn:
    id: "filter-apply-button"
- waitForAnimationToEnd

# The empty state, and the badge agreeing with it — not just one or the other.
- extendedWaitUntil:
    visible: ".*Nothing found.*"
    timeout: 10000
- assertVisible:
    id: "list-header-badge-count"
    text: "0"

# ---- and back ----
- tapOn:
    id: "filter-button"
- extendedWaitUntil:
    visible:
      id: "filter-apply-button"
    timeout: 6000
- tapOn: "All"
- tapOn:
    id: "filter-apply-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 15000
- assertVisible:
    id: "list-header-badge-count"
    text: ${output.observationsBaselineBadge}

- runFlow: common/back.yaml
# Scroll back up first: MainScreen keeps the offset left by the scrollUntilVisible
# that reached the section grid, so on return the top of the dashboard sits under
# the header — present in the hierarchy, but not visible, which is what Maestro
# asserts on. Same reason as in offline-nested-observation-in-diary.yaml.
- scrollUntilVisible:
    element:
      id: "quick-action-observation"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 10000
