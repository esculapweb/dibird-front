# Guest mode: the catalogue is reachable without an account, and the actions
# that do need one ask for it instead of failing.
#
# This is the funnel this release exists for — install → look at a bird → hit
# a reason to sign up — so it starts from a genuinely clean install.
# clearKeychain in addition to clearState: the session token lives in the iOS
# Keychain (expo-secure-store), which clearState does not wipe, and a leftover
# session from any earlier flow would land on MainScreen and quietly test
# nothing. The opposite of create-observation.yaml's deliberate session reuse.
#
# Deliberately never logs in: everything below has to work with no account at
# all. If a screen here starts needing one, this fails rather than the
# regression reaching the store.
#
# "Osprey" as the search term: name search is a backend feature
# (`/api/taxon/?name=`, same one the shared-link fixture uses), and Osprey is
# in every IOC list — this flow is about guest access, not about which birds
# the seed data happens to hold.
#
# appId matches the dev-client build (com.dibird.app.dev).
# tags: ios — see login.yaml.
appId: com.dibird.app.dev
tags:
  - ios
---
- clearKeychain
- launchApp:
    clearState: true

- runFlow: common/ios-bootstrap.yaml

# Phase 1: the guest entry point exists on Welcome, below the sign-in buttons.
- assertVisible: ".*Continue with email.*"
- assertVisible: ".*Browse the birds of the world.*"
- tapOn: ".*Browse the birds of the world.*"
- waitForAnimationToEnd

# Phase 2: the species list loads with no token attached. The search box is
# NOT auto-focused on this entry point — WelcomeScreen's handleGuestBrowse
# navigates to Taxonomy without `focusSearch`, unlike FloatingNavbar's search
# shortcut — so tap it first: `pasteText` goes to the focused field, and with
# nothing focused it silently pastes nowhere and the assert below then fails
# against the default alphabetical list (Abbott's Babbler & co).
- tapOn: ".*Search a species by name.*"
- setClipboard: "Osprey"
- pasteText
# pressKey, not hideKeyboard: on iOS 26 Maestro hides the keyboard by pressing
# Return and then verifies it actually went away — and that verification is
# what fails ("Couldn't hide the keyboard"), intermittently, on this screen.
# Return alone does the same job without the flaky postcondition: SearchInput
# has no onSubmitEditing, so it only drops focus. Same class of workaround as
# common/ios-credential-entry.yaml's tap on a static label (there a plain
# Return could not be used at all — that form submits on it).
- pressKey: Enter
# Search is debounced and served by the backend (`/api/taxon/?name=`), so the
# list can't be there yet when pasteText returns — wait for the result rather
# than asserting on whatever is on screen at that instant.
- extendedWaitUntil:
    visible: ".*Osprey.*"
    timeout: 10000

# Phase 3: the detail page renders for a guest.
# Tapped by the scientific name, not by ".*Osprey.*": an iOS text field
# reports its own contents as its accessibility value, so after Phase 2 the
# search box itself matches "Osprey" — and being higher up the hierarchy it
# wins, so the tap lands back in the input and the screen never changes.
# TaxonRow carries no testID, and the latin name is on the row only.
- tapOn: ".*Pandion haliaetus.*"
- waitForAnimationToEnd
- assertVisible:
    id: "species-scroll"

# Phase 4: the one action that needs an account. The sheet is the whole point
# of guest mode — without it the bird page is a dead end, and behind a hard
# login wall the guest never reached it at all.
#
# Asserted on the buttons, not on the sheet's title ("auth_required_title"):
# iOS collapses the sheet's content into the accessibility element of the
# gorhom container, so plain <Text> never reaches the view hierarchy Maestro
# queries — only the pressables do, as buttons carrying their own label.
#
# Google specifically, because it is the one option present on every device:
# Apple only renders where AppleAuthentication.isAvailableAsync says so. Both
# of them being in the sheet at all is the point — before, the only way out of
# it was an email signup form, and social login sat on Welcome, under the
# whole catalog stack.
- tapOn:
    id: "add-observation-fab"
- waitForAnimationToEnd
- assertVisible:
    id: "auth-option-google"
- assertVisible:
    id: "auth-option-email"

# Declining must leave the guest where they were: the editor is signed-in only.
- tapOn:
    id: "auth-gate-cancel-button"
- waitForAnimationToEnd
- assertVisible:
    id: "species-scroll"

# Phase 5: a shared link opens in the app without an account — the half of the
# Share buttons that used to bounce its recipient out to the website
# (linking.ts). The custom scheme, not https://dibird.com: universal links are
# associated with the production bundle id, not this dev-client build.
- openLink: "dibird://species/osprey/"
# iOS 26 puts an `Open in "DiBird (Dev)"?` system prompt in front of a
# custom-scheme link handed to an app that is already in the foreground —
# it doesn't appear for ios-bootstrap.yaml's exp+dibird:// link, which
# `stopApp` precedes. Optional so the flow still runs on OS versions that
# open the link straight away.
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    id: "species-scroll"
# Back leads to Welcome, not a crash: the guest stack has no Main to sit under.
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- assertVisible: ".*Continue with email.*"
