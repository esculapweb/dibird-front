# Device-level online test: full create -> update -> delete lifecycle for
# an Observation, entirely online — network-independent counterpart to
# offline-create-observation.yaml, mirrored exactly except it never
# touches toggleAirplaneMode, so create/update/delete round-trip the API
# directly instead of queuing through the mutation-queue-then-sync path.
# No pending-icon dance either: an online create resolves to synced fast
# enough that there's no reliable window to assert a pending icon, so
# this flow treats the immediate presence of "Delete observation"
# (is_owner-gated, only true for a real persisted record) as proof the
# save round-tripped the server.
#
# appId is the single Android package for every build variant.
# tags: android — see login.yaml.
appId: com.dibird.app
tags:
  - android
---
# No clearState: session reuse — see offline-create-observation.yaml.
- launchApp

- runFlow: common/android-bootstrap.yaml

- extendedWaitUntil:
    visible:
      id: "observations-stat-value"
    timeout: 20000
- copyTextFrom:
    id: "observations-stat-value"
# maestro.copiedText is clipboard-backed — stash it before any later
# setClipboard can clobber it.
- evalScript: ${output.observationBaselineCount = maestro.copiedText}

# ---- CREATE, online ----
- tapOn:
    id: "quick-action-observation"
- tapOn:
    id: "species-dropdown-trigger"
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 6000
- tapOn:
    id: "option-row-0"
- tapOn:
    id: "observation-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "observation-save-button"
- assertVisible: ".*Delete observation.*"

# ---- UPDATE, online ----
- tapOn:
    id: "observation-edit-button"
- waitForAnimationToEnd
- tapOn:
    text: "Public"
- tapOn:
    id: "observation-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "observation-save-button"
- assertVisible: "Private"

# ---- DELETE, online ----
- tapOn:
    id: "observation-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
- assertVisible: ".*Observations.*"

# Delete's onSuccess is a plain goBack() — opened straight from
# MainScreen's quick action (no list ever pushed, unlike the offline
# flow, which navigates the list to work the pending-sync icon), so it
# lands directly back on MainScreen. No extra `back` here — one was
# tried and overshot past MainScreen, exiting the app entirely.
- assertVisible:
    id: "observations-stat-value"
    text: ${output.observationBaselineCount}
