# Device-level test: creating a Place after explicitly denying location
# permission — covers the manual-entry fallback called out in
# RELEASE_CHECKLIST.md §4 (deny the location permission outright, then
# confirm that entering coordinates by hand / picking them on the map still
# works instead of the screen being blocked altogether), which every other
# Place flow sidesteps by granting location up front.
#
# usePlaceLocation's locateMe() checks permissionStatus === "denied" and
# calls useLocationUnavailable() instead of requesting a GPS fix (see
# usePlaceLocation.ts) — a bottom sheet, not a crash or a blocked screen.
# latitude-input/longitude-input start genuinely empty in this path (no GPS
# fix means no reverse-geocode autofill either) — but this flow's own manual
# lat/lng entry below still triggers a reverse-geocode (this variant is
# online, unlike offline-create-place.yaml), which can suggest a name into
# place-name-input asynchronously; erase before typing there for the same
# reason every other Place flow does.
#
# Runs on both platforms; text selectors are `.*regex.*` throughout because
# iOS merges icon+label elements into one accessibility node — see
# online-create-observation.yaml.
#
# appId comes from run.sh (--env APP_ID): the iOS build is the dev client,
# Android has one package for every variant.
appId: ${APP_ID}
tags:
  - ios
  - android
---
# The permission value is spelled differently per platform — Maestro hands it
# straight to the OS, and iOS denies location as `never` (see
# online-create-place.yaml for the granting half).
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: deny
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: never

- runFlow: common/bootstrap.yaml

# `tapOn` does not scroll, and this row of the dashboard's Sections grid is the
# last block on a screen whose height depends on the account's own data — how
# many "new species" it has, whether the alerts card and "rare nearby" have
# anything to show. It sat just inside the viewport and passed on that; a card
# above it growing by one button row (BirdOfTheDay, 2026-08-26) was enough to
# drop it out of the iOS hierarchy entirely, which reads as "element not found"
# rather than "not visible". scrollUntilVisible is a no-op when the element is
# already in view, so this costs nothing and stops the flow depending on the
# dashboard's exact height.
- scrollUntilVisible:
    element:
      id: "section-Places"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Places"

# `permissions: location: deny` in launchApp records the denial but does NOT
# mark it as final: on an app that has never asked before (a fresh install, or
# `pm clear` from reset-state.sh) Android still shows the system dialog — it
# covers the list, and the badge count below is then not found. Denying it by
# hand is exactly the state this flow is about. The flow only survived without
# this because the denial had already been written by an earlier run; with
# state reset it failed on its very first step.
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"

- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 10000
- copyTextFrom:
    id: "list-header-badge-count"
- evalScript: ${output.placeBaselineCount = maestro.copiedText}

- tapOn:
    id: "list-add-button"

# locateMe() fires on mount, sees the denied permission, and shows this
# bottom sheet instead of ever requesting a fix — dismiss it and confirm
# the screen underneath is still fully usable, not blocked.
#
# Asserted on the sheet's "Open settings" button rather than its
# "Location unavailable" title: iOS collapses the gorhom container's contents
# into one accessibility element, so a plain <Text> inside a sheet never
# reaches the hierarchy Maestro queries — only the pressables do, carrying
# their own label (same reason guest-browse.yaml asserts on the auth sheet's
# buttons). The button is specific to this sheet, so nothing is given up.
- extendedWaitUntil:
    visible: ".*Open settings.*"
    timeout: 8000
- tapOn:
    id: "bottom-sheet-cancel-button"

- extendedWaitUntil:
    visible:
      id: "latitude-input"
    timeout: 8000
# Genuinely empty — no GPS fix ever arrived to autofill these, unlike
# every other Place flow (which erases pre-filled text first).
- assertVisible:
    id: "latitude-input"
    text: ""
- assertVisible:
    id: "longitude-input"
    text: ""

- tapOn:
    id: "latitude-input"
- inputText: "48.8566"
- tapOn:
    id: "longitude-input"
- inputText: "2.3522"

- tapOn:
    id: "place-name-input"
- eraseText: 50
- setClipboard: "Denied-Location Test Place"
- pasteText
- tapOn: ".*Latitude.*"

# Territory has no reverse-geocode to auto-fill either — pick manually,
# same technique offline-create-place.yaml uses.
- tapOn:
    id: "dropdown-trigger-CountriesDropdown"
- tapOn: ".*Search.*"
- setClipboard: "France"
- pasteText
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 4000
- tapOn:
    id: "option-row-0"

- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "place-save-button"
- assertVisible: ".*Denied-Location Test Place.*"

# ---- Cleanup ----
- tapOn:
    id: "place-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
- assertVisible: ".*Locations.*"
- assertVisible:
    id: "list-header-badge-count"
    text: ${output.placeBaselineCount}
