# Closes the Google Password Manager offer, if it is on screen.
#
# Google offers the app's saved credential the moment a field that looks like a
# login one takes focus (`autoComplete="email"`, a password field), and every
# Android run has a credential saved for this very app — the batch signs in
# with it. On Android 14+ that offer is a *dialog*, not the keyboard's
# suggestion strip: it takes the focus, so `pasteText` lands in it instead of
# the field, and it covers the lower half of the screen — anything below the
# focused field is then reported as "element not found" rather than as hidden.
# Back dismisses it and leaves the input focused with its keyboard up (measured
# 2026-09-01, on both the e-mail and the password forms).
#
# Conditional, not an unconditional Back: on a device with nothing saved the
# dialog never appears, and a stray Back would close the keyboard instead. The
# `waitForAnimationToEnd` is what makes the condition meaningful — the dialog
# animates in after the tap has already returned, so checking for it
# immediately would race it.
#
# The id is the AOSP one (`android:id/autofill_dialog_picker`), matched by
# regex because only the app's own testIDs land in the hierarchy verbatim;
# scripts/e2e-lint.js knows it as a platform id.
#
# appId is inert here — see common/back.yaml.
appId: ${APP_ID}
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: ".*autofill_dialog_picker.*"
    commands:
      - pressKey: Back
