# Android's entry point into the shared preamble — kept as its own file so the
# ten Android flows referencing it by name did not all have to change when the
# preamble became cross-platform.
#
# Everything it used to do by hand now lives in common/bootstrap.yaml (connect
# → sign in if needed → unwind to MainScreen), which the iOS flows share:
# the two copies had drifted into fixing the same flakes twice.
#
# appId is inert here — see common/back.yaml.
appId: ${APP_ID}
---
- runFlow: bootstrap.yaml
