# Shared subflow for every Android flow: connect to Metro, dismiss the
# dev-client's onboarding tooltip, disable the floating "Tools button",
# log in with real credentials if no session was restored, then unwind
# back to MainScreen if a warm relaunch reopened onto a leftover screen.
# Lives under common/ so Maestro's directory scan never picks it up as its
# own top-level flow — still needs its own appId + `---` below, though:
# `maestro test` refuses to load a runFlow-referenced file without one.
#
# Metro is reached over `localhost` — run.sh sets up `adb reverse tcp:8081
# tcp:8081` before every Android run, so the emulator's loopback tunnels to
# the host's Metro. This is deliberately NOT the host's LAN IP: loopback
# survives `toggleAirplaneMode`, so a bundle re-fetch while offline still
# works instead of dropping the app onto the dev-client's "problem loading
# the project" error screen (see the long note in run.sh). Nothing else
# moves to loopback — the app's baked-in API base URL
# (EXPO_PUBLIC_BASE_URL in .env.development.local) is still the host's LAN
# address, which is what airplane mode is meant to cut off. That URL, not
# this file, is the one to update when the host's IP changes; 10.0.2.2 (the
# emulator's host alias) is no use for either, it goes over the virtual
# NIC and dies in airplane mode too.
#
# Connects via the same exp+dibird:// deep link Metro's own CLI opens when
# you press `a` (shown in its terminal output as "Opening exp+dibird://...
# on <device>") — an Android intent (openLink), not a UI tap. Tapping the
# dev-client's on-screen server list was flaky: Maestro's tap sometimes
# didn't register on that particular list item even though the element was
# found, silently leaving the app stuck on the native chooser screen for
# the rest of the flow. The deep link sidesteps that UI entirely and also
# doesn't depend on whichever address the dev-client's discovery happens to
# show (LAN vs a VPN tunnel IP, which has flipped mid-session before).
#
# stopApp first is load-bearing: every caller already did `launchApp`
# before running this shared flow, so without this the deep link's intent
# lands on the already-running chooser activity via onNewIntent — which
# doesn't act on it — instead of a cold launch that actually connects.
appId: com.dibird.app
---
- stopApp

- openLink: "exp+dibird://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# Metro takes a few seconds to reconnect — wait out the connecting toast
# instead of racing it with a plain waitForAnimationToEnd.
- extendedWaitUntil:
    notVisible: ".*Connecting to the development server.*"
    timeout: 12000
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn:
          text: "Tools button"
      - back

- runFlow:
    when:
      visible: ".*Continue with email.*"
    commands:
      - tapOn: ".*Continue with email.*"
      - tapOn:
          id: "email-input"
      - setClipboard: "${TEST_EMAIL}"
      - pasteText
      - tapOn:
          id: "password-input"
      - tapOn:
          id: "password-input-toggle-visibility"
      - tapOn:
          id: "password-input"
      - setClipboard: "${TEST_PASSWORD}"
      - pasteText
      # Plain `back`/hideKeyboard both misbehave on this custom Input —
      # tap a static label instead to defocus without navigating.
      - tapOn:
          text: "Welcome back"
          optional: true
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - tapOn:
          text: "Not Now"
          optional: true

# A warm relaunch can reopen on whatever screen was last open (React
# Navigation restore), not necessarily MainScreen — pop back (bounded, not
# blind, to avoid exiting the app at the stack root) until the
# MainScreen-only quick action appears. optional: true on the first wait
# so a cold start (JS thread not painted yet) falls through to the
# unwind loop instead of hard-failing.
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 10000
