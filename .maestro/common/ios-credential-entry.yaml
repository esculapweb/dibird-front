# Shared "type real credentials and submit" sequence for both iOS flows —
# login.yaml's Phase 2 and create-observation.yaml's session-reuse
# fallback. Caller must already have confirmed ".*Continue with email.*"
# is visible before invoking this. Needs its own appId + `---` below even
# as a runFlow target — Maestro refuses to load one without a config
# section.
appId: com.dibird.app.dev
---
- tapOn: ".*Continue with email.*"
- tapOn:
    id: "email-input"
# setClipboard+pasteText, not inputText: keyboard-layout independent
# (inputText simulates real keystrokes, breaking under non-Latin layouts).
- setClipboard: "${TEST_EMAIL}"
- pasteText
- tapOn:
    id: "password-input"
# iOS silently blocks paste into secureTextEntry fields — toggle
# visibility off first so pasteText actually lands.
- tapOn:
    id: "password-input-toggle-visibility"
- tapOn:
    id: "password-input"
- setClipboard: "${TEST_PASSWORD}"
- pasteText
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Dismiss iOS's own "Save Password?" iCloud Keychain prompt, unrelated to
# the app.
- tapOn:
    text: "Not Now"
    optional: true
