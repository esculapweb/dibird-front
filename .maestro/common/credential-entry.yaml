# "Type real credentials and submit", shared by both platforms.
#
# Caller must already have confirmed ".*Continue with email.*" is visible.
# Merged from the iOS-only common/ios-credential-entry.yaml and the identical
# block that used to sit inline in common/android-bootstrap.yaml — the two had
# already converged step for step, and keeping them apart only meant fixing the
# same flake twice.
#
# Every selector here is an id or a `.*regex.*`, which matches on both
# platforms: iOS merges an icon+label button into one accessibility element
# (", Continue with email"), so a literal selector only ever works on Android.
#
# appId is inert here — see common/back.yaml.
appId: ${APP_ID}
---
- tapOn: ".*Continue with email.*"
- tapOn:
    id: "email-input"
# setClipboard+pasteText, not inputText: keyboard-layout independent
# (inputText simulates real keystrokes, breaking under non-Latin layouts).
- setClipboard: "${TEST_EMAIL}"
- pasteText
- tapOn:
    id: "password-input"
# iOS silently blocks paste into secureTextEntry fields — toggle visibility
# off first so pasteText actually lands.
- tapOn:
    id: "password-input-toggle-visibility"
- tapOn:
    id: "password-input"
- setClipboard: "${TEST_PASSWORD}"
- pasteText
# Not hideKeyboard: on iOS 26 Maestro dismisses the keyboard by pressing
# Return, which this Input submits on — the form goes off on its own, the
# submit tap below then finds no button left, and hideKeyboard itself still
# reports "Couldn't hide the keyboard". Android misbehaves on this custom
# Input too. Tapping a static label defocuses without navigating instead
# (the form scrolls, so keyboardShouldPersistTaps lets the tap through).
- tapOn:
    text: "Welcome back"
    optional: true
- tapOn:
    id: "login-submit-button"
- waitForAnimationToEnd
# Dismiss iOS's own "Save Password?" iCloud Keychain prompt, unrelated to the
# app. Never appears on Android, hence optional there rather than branched.
- tapOn:
    text: "Not Now"
    optional: true
