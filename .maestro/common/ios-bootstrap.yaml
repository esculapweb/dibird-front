# iOS's entry point into the shared "connect to Metro" step — kept as its own
# file so the iOS flows referencing it by name did not all have to change when
# that step became cross-platform.
#
# Deliberately connect-only (common/connect.yaml), not the full
# common/bootstrap.yaml: the guest flows that use this must not sign in, and
# the flows that do want a session ask for it themselves.
#
# appId is inert here — see common/back.yaml.
appId: ${APP_ID}
---
- runFlow: connect.yaml
