# Device-level offline test: full create -> update -> delete lifecycle for
# an Observation, each step done in real airplane mode, with a reconnect
# between each to verify sync completes.
#
# Android only: toggleAirplaneMode is a real OS-level radio toggle (adb);
# Maestro has no iOS Simulator equivalent (no radio stack). No dev-only
# network override exists — this is a genuine disconnect, so
# services/sync/networkStatus.ts sees it like a real user would.
#
# appId is the single Android package for every build variant (unlike
# iOS, which has a distinct bundleIdentifier per channel).
#
# Assumes the emulator starts with airplane mode OFF — toggleAirplaneMode
# flips whatever the current state is, so this toggles on once (go
# offline) and off once (reconnect), not to a named state.
#
# tags: android — see login.yaml.
appId: com.dibird.app
tags:
  - android
---
# No clearState: session reuse — a full re-login only runs on the very
# first flow of a session. The local mutation-queue db also isn't reset
# between flows, so each flow's create->update->delete cycle must net to
# zero on its own; a crashed prior run can leave stray data behind (shows
# up as the final count check reading one high — clean up by hand).
- launchApp

- runFlow: common/android-bootstrap.yaml

# Real budget for the login POST round-trip. Waits on the stat card's own
# testID, not ".*Observations.*" text — that regex also matches an
# unrelated grid label that renders before the real stat value is ready.
- extendedWaitUntil:
    visible:
      id: "observations-stat-value"
    timeout: 20000

# Capture the server-truth count now — real proof the delete at the end
# reached the server, not just that its confirm dialog was tapped.
- copyTextFrom:
    id: "observations-stat-value"
# maestro.copiedText is clipboard-backed, not a dedicated result slot —
# stash it in the `output` store before a later setClipboard can clobber it.
- evalScript: ${output.observationBaselineCount = maestro.copiedText}

# Go offline before creating anything, so the record enqueues locally
# instead of reaching the API.
- toggleAirplaneMode

- tapOn:
    id: "quick-action-observation"
- tapOn:
    id: "species-dropdown-trigger"
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 6000
- tapOn:
    id: "option-row-0"
- tapOn:
    id: "observation-save-button"

- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "observation-save-button"

# Local-first create lands on the (temp-id) detail screen even offline —
# used only as a wait gate before `back` (is_owner is always true for a
# just-created record, synced or not, so it doesn't itself prove sync
# state).
- extendedWaitUntil:
    visible: ".*Delete observation.*"
    timeout: 6000
- back
- tapOn:
    id: "section-Observations"
- assertVisible:
    id: "observation-sync-pending-icon"

# Tap the pending icon to reopen the detail screen — reliable only before
# reconnecting, since a pending create is always prepended to page 1;
# once synced it sorts wherever normal order places it.
- tapOn:
    id: "observation-sync-pending-icon"

# Reconnect for real — wakes the reconnect listener and drains the
# mutation queue against the live API.
- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- UPDATE, offline ----
# Editing the now-synced (real positive id) observation exercises a
# genuine update mutation, unlike editing a still-pending create (which
# just amends that create in place).
- toggleAirplaneMode
- tapOn:
    id: "observation-edit-button"
- waitForAnimationToEnd
# Toggle privacy (defaults to "Public") — a deterministic field to assert
# against, unlike the pending icon's list position.
- tapOn:
    text: "Public"
- tapOn:
    id: "observation-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "observation-save-button"
# Edit-mode save navigates back to this same detail screen — assert the
# flipped label rather than re-checking the list (an update's pending
# badge isn't guaranteed to be on the first page).
- assertVisible: "Private"

# Reconnect — drain/retry/backoff itself is covered directly by
# services/sync/__tests__/observationSync.test.ts.
- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- DELETE, offline ----
- toggleAirplaneMode
- tapOn:
    id: "observation-delete-button"
# Confirm sheet slides up asynchronously — wait for it, don't race it.
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
- assertVisible: ".*Observations.*"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# Add/delete both invalidate ["DashboardStat"], so this refetches once
# back online — should land exactly back on the baseline captured above.
- back
- assertVisible:
    id: "observations-stat-value"
    text: ${output.observationBaselineCount}
