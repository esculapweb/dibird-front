# "I forgot my password": from the login form to the letter being sent.
#
# Worth a device test rather than a unit test, because the half that used to be
# broken is the half no unit test can see. `POST /api-auth/password/reset/`
# answered 500 for every existing address — dj-rest-auth builds the link in the
# letter with `reverse('password_reset_confirm')`, a route name this project
# does not have (allauth calls its own `account_reset_password_from_key`). The
# app's own tests mock that call, so the only thing that catches the regression
# from this side is a real request to a real backend.
#
# What this flow does NOT do is follow the link. That needs the key from the
# letter, which lives in mailpit and not on the device; the second half —
# parsing `<uid>-<token>` out of the URL and posting it — is covered by
# `linking.deeplinks.test.ts` and `screens/__tests__/PasswordResetScreens.test.tsx`,
# and end to end by the backend's `test_password_api.py`. Opening the link on a
# device stays a manual item (§1 of RELEASE_CHECKLIST).
#
# The password is never actually changed. That matters: the batch shares one
# account per platform, and its password lives in `.maestro/.env.local` — a
# flow that changed it and then died would lock every later flow out of the
# account, with no way back except editing that file by hand.
#
# Requesting the same reset repeatedly across runs is safe against the local
# backend: allauth's rate limits are off under DEBUG (`ACCOUNT_RATE_LIMITS` in
# dibird/settings.py).
#
# Signed out on purpose — the reset form lives in AuthStack, which is not
# mounted while a session exists. Signs back in at the end so the next flow in
# the batch inherits the session every other flow expects, the same courtesy
# logout.yaml does.
#
# appId comes from run.sh (--env APP_ID).
appId: ${APP_ID}
tags:
  - ios
  - android
---
# Genuinely signed out. clearKeychain is iOS-only and needed there: the token
# lives in the Keychain (expo-secure-store), which clearState does not wipe.
# Android's clearState is a `pm clear` and takes EncryptedSharedPreferences
# with it. Same preamble as guest-deeplink-no-session.yaml.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true

- runFlow: common/connect.yaml

- extendedWaitUntil:
    visible: ".*Continue with email.*"
    timeout: 20000

# ---- Welcome -> Login ----
- tapOn: ".*Continue with email.*"
- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000

# ---- the way out of a forgotten password ----
# The link sits under the login form. By id rather than by its label: the
# label ends in a question mark, and Maestro reads a text selector as a regex,
# where "?" is a quantifier over the letter before it.
- assertVisible:
    id: "forgot-password-link"
- tapOn:
    id: "forgot-password-link"
- extendedWaitUntil:
    visible:
      id: "forgot-password-submit-button"
    timeout: 10000

# ---- something that is not an address never reaches the server ----
# Cheap, and it is the client-side half of the screen: without it a typo would
# cost a round trip and come back as an unexplained failure.
- tapOn:
    id: "forgot-password-email-input"
- setClipboard: "not-an-address"
- pasteText
- tapOn:
    id: "forgot-password-submit-button"
- waitForAnimationToEnd
# Still here: the screen only leaves for CheckEmail once the request went out.
- assertVisible:
    id: "forgot-password-submit-button"

# ---- the real request ----
# eraseText before typing: the field still holds the rejected value above, and
# pasteText appends to whatever is focused rather than replacing it.
- tapOn:
    id: "forgot-password-email-input"
- eraseText
- setClipboard: "${TEST_EMAIL}"
- pasteText
# Defocus by tapping a static label rather than hideKeyboard — see the comment
# in common/credential-entry.yaml for why hideKeyboard is avoided on this
# custom Input. The subtitle, not the title: "Password reset" is also the
# navigation header, and two matches for one selector is a coin toss.
- tapOn:
    text: ".*send you a link.*"
    optional: true
- tapOn:
    id: "forgot-password-submit-button"

# The letter went out. This is the assertion the 500 would have failed: on a
# broken backend the screen stays put and shows an error toast instead.
# extendedWaitUntil with a generous timeout — the request goes to a local
# Django that also has to render and queue the mail.
- extendedWaitUntil:
    visible: ".*Password reset link sent to.*"
    timeout: 20000

# ---- and it can be asked for again ----
# The button on this screen sends whichever letter the screen is waiting for:
# in `reset` mode another reset link, in `signup` mode the confirmation. A
# regression that mixed the two would tell someone waiting for a reset that
# their address is already confirmed.
- assertVisible:
    id: "resend-letter-button"
- tapOn:
    id: "resend-letter-button"
- waitForAnimationToEnd
# Still the reset screen, and no error surfaced over it.
- assertVisible: ".*Password reset link sent to.*"

# ---- hand the session back to the next flow ----
- runFlow: common/back.yaml
- runFlow: common/back.yaml
- extendedWaitUntil:
    visible: ".*Continue with email.*"
    timeout: 10000
- runFlow: common/credential-entry.yaml
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 25000
