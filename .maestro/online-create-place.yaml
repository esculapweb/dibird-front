# Device-level online test: full create -> update -> delete lifecycle for
# a Place, entirely online — the network-independent counterpart to
# offline-create-place.yaml. See that file (and online-create-observation.yaml)
# for the full bootstrap rationale — this flow mirrors both exactly except
# it never touches toggleAirplaneMode.
#
# appId is the single Android package used for every build variant
# (com.dibird.app in app.config.js).
#
# Run with:
#   npm run e2e:android -- .maestro/online-create-place.yaml
appId: com.dibird.app
---
- launchApp:
    permissions:
      location: allow

# Pin the mock GPS fix to Paris, France — matches the test account's
# default territory filter (see offline-create-place.yaml's header comment
# for why: the emulator's real default location resolves to Belarus).
- setLocation:
    latitude: 48.8566
    longitude: 2.3522

- tapOn:
    text: "192.168.0.102:8081"
    optional: true

- tapOn:
    below: "Then, select the local server when it appears here."
    optional: true
- inputText: "exp://192.168.0.102:8081"
- tapOn:
    text: "Connect"
    optional: true
- extendedWaitUntil:
    notVisible: ".*Connecting to the development server.*"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Tools button"
    commands:
      - tapOn:
          text: "Tools button"
      - back

- runFlow:
    when:
      visible: ".*Continue with email.*"
    commands:
      - tapOn: ".*Continue with email.*"
      - tapOn:
          id: "email-input"
      - setClipboard: "${TEST_EMAIL}"
      - pasteText
      - tapOn:
          id: "password-input"
      - tapOn:
          id: "password-input-toggle-visibility"
      - tapOn:
          id: "password-input"
      - setClipboard: "${TEST_PASSWORD}"
      - pasteText
      - tapOn:
          text: "Welcome back"
          optional: true
      - tapOn:
          id: "login-submit-button"
      - waitForAnimationToEnd
      - tapOn:
          text: "Not Now"
          optional: true

# Give MainScreen's initial render a real chance to land first — see
# offline-create-observation.yaml's equivalent comment for the cold-start
# race this avoids (a premature back press here can exit the app entirely).
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible:
        id: "quick-action-observation"
    commands:
      - back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "quick-action-observation"
          timeout: 4000
          optional: true
- extendedWaitUntil:
    visible:
      id: "quick-action-observation"
    timeout: 15000

- tapOn:
    id: "section-Places"
- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 15000
- copyTextFrom:
    id: "list-header-badge-count"
- evalScript: ${output.placeBaselineCount = maestro.copiedText}

# ---- CREATE, online ----
- tapOn:
    id: "list-add-button"
# FLAG (unverified, same caveat as offline-create-place.yaml): not a real
# wait on locateMe()/reverse-geocode finishing, just a placeholder gate.
- extendedWaitUntil:
    visible:
      id: "latitude-input"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "place-name-input"
# Pre-filled with the reverse-geocoded address — erase first or pasteText
# just appends after it (see offline-create-place.yaml's equivalent note).
- eraseText: 50
- setClipboard: "Online Test Place"
- pasteText
# Dismiss the soft keyboard without navigating — see offline-create-place.yaml's
# CREATE section comment for why plain `back` is unreliable here.
- tapOn:
    text: "Latitude"
- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "place-save-button"
- assertVisible: "Online Test Place"

# ---- UPDATE, online ----
- tapOn:
    id: "place-edit-button"
- waitForAnimationToEnd
- tapOn:
    id: "place-name-input"
- eraseText: 50
- setClipboard: "Online Test Place Updated"
- pasteText
- tapOn:
    text: "Latitude"
- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "place-save-button"
- assertVisible: "Online Test Place Updated"

# ---- DELETE, online ----
- tapOn:
    id: "place-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 5000
- tapOn:
    id: "bottom-sheet-confirm-button"
# Delete's onSuccess navigates back to the Locations list this detail
# screen was opened from — still mounted/focused, so React Query
# auto-refetches the ["Places"] query once the invalidation fires,
# refreshing this badge straight back to server truth.
- assertVisible: ".*Locations.*"
- assertVisible:
    id: "list-header-badge-count"
    text: ${output.placeBaselineCount}
