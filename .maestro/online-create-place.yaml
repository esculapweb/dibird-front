# Device-level online test: full create -> update -> delete lifecycle for
# a Place, entirely online — network-independent counterpart to
# offline-create-place.yaml, mirrored exactly except it never touches
# toggleAirplaneMode.
#
# Runs on both platforms; text selectors are `.*regex.*` throughout because
# iOS merges icon+label elements into one accessibility node — see
# online-create-observation.yaml.
#
# appId comes from run.sh (--env APP_ID): the iOS build is the dev client,
# Android has one package for every variant.
appId: ${APP_ID}
tags:
  - ios
  - android
---
# The permission value is the one thing the two platforms genuinely spell
# differently: Maestro passes it through to the OS, and iOS has no "allow" —
# location is granted as `inuse` (while-in-use) or `always` there.
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            location: inuse

# Pin the mock GPS fix to Paris, France — matches the test account's
# default territory filter (the emulator's real default location
# resolves to Belarus).
- setLocation:
    latitude: 48.8566
    longitude: 2.3522

- runFlow: common/bootstrap.yaml

# `tapOn` does not scroll, and this row of the dashboard's Sections grid is the
# last block on a screen whose height depends on the account's own data — how
# many "new species" it has, whether the alerts card and "rare nearby" have
# anything to show. It sat just inside the viewport and passed on that; a card
# above it growing by one button row (BirdOfTheDay, 2026-08-26) was enough to
# drop it out of the iOS hierarchy entirely, which reads as "element not found"
# rather than "not visible". scrollUntilVisible is a no-op when the element is
# already in view, so this costs nothing and stops the flow depending on the
# dashboard's exact height.
- scrollUntilVisible:
    element:
      id: "section-Places"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Places"
- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 10000
- copyTextFrom:
    id: "list-header-badge-count"
- evalScript: ${output.placeBaselineCount = maestro.copiedText}

# ---- CREATE, online ----
- tapOn:
    id: "list-add-button"
# The FAB's first tap has been seen landing on the right element (Maestro logs
# it COMPLETED, with the right bounds) while the app stays on the list.
# Reproducible when this flow runs straight after
# online-create-place-location-denied.yaml: that one leaves the OS location
# permission revoked, so this flow's `permissions: location: allow` has to
# flip it back at launchApp, and the tap right after that transition is the
# one that gets swallowed. Resetting the permission from run.sh instead was
# tried and is worse — it makes the deny flow itself flip grant->revoke, which
# pops usePlaceLocation's "Location unavailable" sheet over MainScreen and
# eats *its* first tap. So: retry once here.
#
# The optional wait in front is load-bearing: `when: notVisible` is evaluated
# immediately, so without it the retry fires while the editor is still opening
# and then fails looking for a "+" button that is no longer on screen.
- extendedWaitUntil:
    visible:
      id: "latitude-input"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "latitude-input"
    commands:
      - tapOn:
          id: "list-add-button"
- extendedWaitUntil:
    visible:
      id: "latitude-input"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "place-name-input"
# Pre-filled with the reverse-geocoded address — erase first or pasteText
# just appends after it.
- eraseText: 50
- setClipboard: "Online Test Place"
- pasteText
# Dismiss the soft keyboard without navigating — see
# offline-create-place.yaml's CREATE section for why plain `back` is
# unreliable here.
- tapOn: ".*Latitude.*"
- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "place-save-button"
# Asserted on the detail screen's edit button, not on the name: the editor's
# own name field reports its contents as text too, so a save that never went
# through (e.g. the reverse geocode hadn't filled Country yet and the form
# refused with "Country is required") still matched the name and the failure
# only surfaced a step later, as a missing button with no explanation.
- extendedWaitUntil:
    visible:
      id: "place-edit-button"
    timeout: 10000
- assertVisible: ".*Online Test Place.*"

# ---- UPDATE, online ----
- tapOn:
    id: "place-edit-button"
- waitForAnimationToEnd
- tapOn:
    id: "place-name-input"
- eraseText: 50
- setClipboard: "Online Test Place Updated"
- pasteText
- tapOn: ".*Latitude.*"
- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "place-save-button"
- extendedWaitUntil:
    visible:
      id: "place-edit-button"
    timeout: 10000
- assertVisible: ".*Online Test Place Updated.*"

# ---- DELETE, online ----
- tapOn:
    id: "place-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
# Delete's onSuccess navigates back to the Locations list this screen was
# opened from — still mounted/focused, so it auto-refetches the
# ["Places"] query once the invalidation fires, refreshing the badge
# straight back to server truth.
- assertVisible: ".*Locations.*"
- assertVisible:
    id: "list-header-badge-count"
    text: ${output.placeBaselineCount}
