# Device-level offline test: full create -> update -> delete lifecycle for
# a Place in real airplane mode, with a reconnect between each step. See
# offline-create-observation.yaml for the shared rationale (Android-only,
# real toggleAirplaneMode, session reuse).
#
# PlaceEditorScreen auto-triggers a GPS fix on mount via
# hooks/Place/usePlaceLocation.ts — needs location permission (granted
# below) but not network: it reads the OS-level mock coordinate injected
# via setLocation, so CREATE below runs fully offline from screen-open.
# Only the reverse-geocode derived from that fix needs network, and
# CREATE doesn't depend on it — territory is picked manually from the
# dropdown instead (the same fix PlaceForm.tsx uses to seed the dropdown
# in edit mode, which UPDATE below regression-checks).
#
# setLocation pins the mock GPS fix to Paris, France — a deterministic
# coordinate CREATE's own assertions confirm actually landed in the form
# while offline (the emulator's real default location resolves to
# Belarus).
#
# Place has no DashboardStat on MainScreen to prove a delete reached the
# server — uses the Locations list's own header badge count instead
# (server truth once nothing is pending).
#
# appId is the single Android package for every build variant.
# tags: android — see login.yaml.
appId: com.dibird.app
tags:
  - android
---
# Grant location permission up front (native dialog text is version/
# locale dependent) — PlaceEditorScreen calls locateMe() unconditionally
# on mount, and an unresolved lat/lng blocks saving (a required field).
#
# No clearState: session reuse — see offline-create-observation.yaml.
- launchApp:
    permissions:
      location: allow

- setLocation:
    latitude: 48.8566
    longitude: 2.3522

- runFlow: common/android-bootstrap.yaml

# The section grid sits below the fold: the dashboard's height follows the
# account's own data, so the tile is not reliably in view (see the longer
# note in online-create-place.yaml). No-op when it already is.
- scrollUntilVisible:
    element:
      id: "section-Places"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "section-Places"
# Wait for the list's first page to actually load before reading the badge.
- extendedWaitUntil:
    visible:
      id: "list-header-badge-count"
    timeout: 10000
# Capture the server-truth count now — real proof the delete at the end
# reached the server.
- copyTextFrom:
    id: "list-header-badge-count"
# maestro.copiedText is clipboard-backed — this flow's own UPDATE step
# later does setClipboard+pasteText to rename the place, which would
# clobber it. Stash it in the `output` store instead.
- evalScript: ${output.placeBaselineCount = maestro.copiedText}

# Go offline here, before opening the creation screen — locateMe() reads
# the OS-level mock coordinate directly (no network involved); only the
# reverse-geocode needs network, and that's not load-bearing since CREATE
# picks territory manually below (offline it just fails silently, a
# __DEV__-only warning, same as a real offline user would see).
- toggleAirplaneMode

# ---- CREATE, fully offline from screen-open ----
- tapOn:
    id: "list-add-button"

# latitude-input is visible on mount regardless of whether locateMe() has
# resolved — the text assertion after it is what actually confirms the
# mocked coordinate landed while offline.
- extendedWaitUntil:
    visible:
      id: "latitude-input"
    timeout: 6000
- assertVisible:
    id: "latitude-input"
    text: "48.8566"
- assertVisible:
    id: "longitude-input"
    text: "2.3522"
- waitForAnimationToEnd:
    timeout: 4000

- tapOn:
    id: "place-name-input"
# Pre-filled with the reverse-geocoded address when that resolves in
# time — erase first or pasteText just appends. Offline it never
# resolves, so this is defensive.
- eraseText: 50
- setClipboard: "Offline Test Place"
- pasteText
# hideKeyboard is unsupported here and plain `back` can pop the screen
# instead of just dismissing the IME — tap a static label to defocus
# safely.
- tapOn:
    text: "Latitude"

# Pick territory manually instead of the network-dependent reverse-geocode
# auto-fill. Works offline because MainScreen already warms this exact
# react-query cache entry (24h staleTime) right after login. Picks France
# specifically, to match the test account's default territory filter used
# by the final count assertion.
- tapOn:
    id: "dropdown-trigger-CountriesDropdown"
- tapOn:
    text: "Search..."
- setClipboard: "France"
- pasteText
- extendedWaitUntil:
    visible:
      id: "option-row-0"
    timeout: 4000
- tapOn:
    id: "option-row-0"

- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "place-save-button"

# A successful save replaces the editor with the detail screen — used as
# a wait gate before `back`.
- assertVisible: "Offline Test Place"
- back
- assertVisible:
    id: "place-sync-pending-icon"

# Tap the pending icon to reopen the detail screen — reliable only before
# reconnecting (a pending create is always prepended to page 1).
- tapOn:
    id: "place-sync-pending-icon"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- UPDATE, offline ----
# Rename the place (a deterministic field to assert against), rather than
# toggling the header's favourite star, which has no text signal.
- toggleAirplaneMode
- tapOn:
    id: "place-edit-button"
- waitForAnimationToEnd
# Regression check: editing an offline-created place used to leave
# Country showing the placeholder instead of the saved territory
# (PlaceForm only seeded the dropdown from the network-dependent
# reverse-geocode, never from the place's own saved value). Text-only
# selector: the dropdown trigger's own `text` is empty (the "France"
# string lives on a separate child node with no id of its own), so
# id+text together is unmatchable here by construction.
- assertVisible: "France"
- tapOn:
    id: "place-name-input"
- eraseText: 50
- setClipboard: "Offline Test Place Updated"
- pasteText
- tapOn:
    text: "Latitude"
- tapOn:
    id: "place-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - tapOn:
          id: "place-save-button"
- assertVisible: "Offline Test Place Updated"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# ---- DELETE, offline ----
- toggleAirplaneMode
- tapOn:
    id: "place-delete-button"
# Confirm sheet slides up asynchronously — wait for it, don't race it.
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
- assertVisible: ".*Locations.*"

- toggleAirplaneMode
- waitForAnimationToEnd:
    timeout: 4000

# Add/update/delete all invalidate ["Places"], and this screen stays
# mounted/focused, so it auto-refetches once reconnected — should land
# back on the baseline captured at the start.
- assertVisible:
    id: "list-header-badge-count"
    text: ${output.placeBaselineCount}
