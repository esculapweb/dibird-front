# Device-level online test: full create -> update -> delete lifecycle for
# a Diary, entirely online — network-independent counterpart to
# offline-create-diary.yaml, mirrored exactly except it never touches
# toggleAirplaneMode.
#
# Runs on both platforms; text selectors are `.*regex.*` throughout because
# iOS merges icon+label elements into one accessibility node — see
# online-create-observation.yaml.
#
# appId comes from run.sh (--env APP_ID): the iOS build is the dev client,
# Android has one package for every variant.
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp

- runFlow: common/bootstrap.yaml

- extendedWaitUntil:
    visible:
      id: "diaries-stat-value"
    timeout: 20000
- copyTextFrom:
    id: "diaries-stat-value"
- evalScript: ${output.diaryBaselineCount = maestro.copiedText}

# ---- CREATE, online ----
- tapOn:
    id: "quick-action-diary"
- tapOn:
    id: "diary-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "diary-save-button"
- extendedWaitUntil:
    visible:
      id: "diary-edit-button"
    timeout: 8000

# ---- UPDATE, online ----
- tapOn:
    id: "diary-edit-button"
- waitForAnimationToEnd
- tapOn: ".*Public.*"
- tapOn:
    id: "diary-save-button"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - runFlow: common/back.yaml
      - tapOn:
          id: "diary-save-button"
- assertVisible: ".*Private.*"

# ---- DELETE, online ----
- tapOn:
    id: "overflow-button"
- tapOn:
    id: "diary-delete-button"
- extendedWaitUntil:
    visible:
      id: "bottom-sheet-confirm-button"
    timeout: 4000
- tapOn:
    id: "bottom-sheet-confirm-button"
- assertVisible: ".*Diaries.*"

# Delete's onSuccess is a plain goBack() — opened straight from
# MainScreen's quick action (no list ever pushed), so it lands directly
# back on MainScreen; an extra `back` here would exit the app.
- assertVisible:
    id: "diaries-stat-value"
    text: ${output.diaryBaselineCount}
